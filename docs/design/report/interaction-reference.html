<title>PerfTracker 세션 리포트 — 목업</title>

<style>
  :root {
    --ground: #f6f7f9; --panel: #ffffff; --ink: #14171d; --ink-2: #4a515e;
    --muted: #868e9d; --line: #e2e5eb; --line-2: #eef0f4;
    --accent: #3d6fd4; --alert: #c8503a; --warm: #b8814a; --pill: #f2f4f8;
    --note: #fff8e8; --note-line: #e8d9b4; --note-ink: #6b5a2e; --nav: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0b0e12; --panel: #14181e; --ink: #e7eaf0; --ink-2: #a6adba;
      --muted: #737b8a; --line: #242a33; --line-2: #1b2028;
      --accent: #6d99e8; --alert: #e0765c; --warm: #cf9c62; --pill: #1b2029;
      --note: #1e1b12; --note-line: #3b331f; --note-ink: #c4b184; --nav: #11151a;
    }
  }
  :root[data-theme="dark"] {
    --ground: #0b0e12; --panel: #14181e; --ink: #e7eaf0; --ink-2: #a6adba;
    --muted: #737b8a; --line: #242a33; --line-2: #1b2028;
    --accent: #6d99e8; --alert: #e0765c; --warm: #cf9c62; --pill: #1b2029;
    --note: #1e1b12; --note-line: #3b331f; --note-ink: #c4b184; --nav: #11151a;
  }
  :root[data-theme="light"] {
    --ground: #f6f7f9; --panel: #ffffff; --ink: #14171d; --ink-2: #4a515e;
    --muted: #868e9d; --line: #e2e5eb; --line-2: #eef0f4;
    --accent: #3d6fd4; --alert: #c8503a; --warm: #b8814a; --pill: #f2f4f8;
    --note: #fff8e8; --note-line: #e8d9b4; --note-ink: #6b5a2e; --nav: #ffffff;
  }

  body {
    background: var(--ground); color: var(--ink); margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ---------- 레이아웃 ---------- */
  .shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }
  @media (max-width: 760px) { .shell { grid-template-columns: 1fr; } }

  nav {
    background: var(--nav); border-right: 1px solid var(--line);
    padding: 22px 0; position: sticky; top: 0; align-self: start; height: 100vh;
  }
  @media (max-width: 760px) { nav { height: auto; position: static; border-right: 0; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 12px 16px; flex-wrap: wrap; } }
  .brand { padding: 0 20px 20px; border-bottom: 1px solid var(--line-2); margin-bottom: 12px; }
  @media (max-width: 760px) { .brand { border: 0; padding: 0 8px 0 0; margin: 0; } }
  .brand .b1 { font-size: 15px; font-weight: 640; letter-spacing: -0.01em; }
  .brand .b2 { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .navbtn {
    display: block; width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: transparent; border: 0; border-left: 2px solid transparent;
    padding: 9px 20px; color: var(--ink-2); font-size: 13px; font-weight: 500;
  }
  @media (max-width: 760px) { .navbtn { width: auto; border-left: 0; border-bottom: 2px solid transparent; padding: 6px 10px; } }
  .navbtn:hover { color: var(--ink); }
  .navbtn[aria-current="true"] { color: var(--accent); border-color: var(--accent); background: var(--pill); font-weight: 620; }

  main { padding: 26px 28px 72px; max-width: 1240px; }
  @media (max-width: 760px) { main { padding: 18px 16px 60px; } }

  /* ---------- 헤더 ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 24px; margin-bottom: 10px; }
  .top h1 { font-size: 20px; font-weight: 640; letter-spacing: -0.015em; margin: 0; }
  .top .kv { font-size: 12.5px; color: var(--ink-2); }
  .top .kv i { font-style: normal; color: var(--muted); margin-right: 5px; }
  .flags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 22px; }
  .flag { font-size: 11.5px; padding: 3px 9px; border-radius: 20px; background: var(--pill); color: var(--ink-2); border: 1px solid var(--line); }
  .flag.warn { border-color: var(--note-line); background: var(--note); color: var(--note-ink); }

  /* ---------- 요약 타일 ---------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 30px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; }
  .tile .tk { font-size: 10.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); }
  .tile .tv { font-size: 21px; font-weight: 640; letter-spacing: -0.015em; margin-top: 3px; }
  .tile .tv u { text-decoration: none; font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .tile .ts { font-size: 11.5px; color: var(--muted); margin-top: 2px; }

  /* ---------- 섹션 ---------- */
  .sec { margin-bottom: 30px; }
  .sec > h2 {
    font-size: 12px; font-weight: 650; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin: 0 0 10px; display: flex; align-items: center; gap: 10px;
  }
  .sec > h2::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .sec > h2 em { font-style: normal; font-size: 11px; letter-spacing: 0; text-transform: none; color: var(--muted); font-weight: 400; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 15px 10px; }
  .card.live { border-color: var(--accent); }
  .chead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .chead .name { font-size: 13px; font-weight: 590; }
  .chead .unit { font-size: 11px; color: var(--muted); font-weight: 400; margin-left: 5px; }
  .readout { font-size: 13px; font-weight: 620; color: var(--muted); }
  .readout.on { color: var(--accent); }
  .readout .none { color: var(--muted); font-weight: 400; font-style: italic; font-size: 12px; }

  svg { display: block; }

  /* ---------- 분포 ---------- */
  .dist-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 14px; margin-bottom: 12px; }
  .dist-head .lead { font-size: 15px; font-weight: 610; }
  .dist-head .sub { font-size: 12px; color: var(--muted); }
  .pcts { display: flex; gap: 20px; flex-wrap: wrap; }
  .pct { font-size: 11.5px; color: var(--muted); }
  .pct b { display: block; font-size: 15px; font-weight: 620; color: var(--ink); }
  .pct b u { text-decoration: none; font-size: 11px; font-weight: 400; color: var(--muted); }
  .dist-scroll { overflow-x: auto; }
  .bar { fill: var(--accent); }
  .bar.dim { opacity: 0.34; }
  .bar.hot { opacity: 1; }
  .axis-line { stroke: var(--line); }
  .tick { fill: var(--muted); font-size: 10px; }
  .pline { stroke: var(--ink-2); stroke-dasharray: 3 3; opacity: 0.55; }
  .plabel { fill: var(--ink-2); font-size: 9.5px; }
  .brk { stroke: var(--line); }
  .brk-t { fill: var(--muted); font-size: 9.5px; }

  /* ---------- 타임라인 ---------- */
  /* 타임라인은 선이다. 막대는 분포(A) 하나뿐 — 추이와 분포는 모양이 달라야 한다. */
  .tline { fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round; }
  .tline.warm { stroke: var(--warm); }
  .tline.err { stroke: var(--alert); stroke-width: 1.2; }
  .tarea { fill: var(--accent); opacity: 0.1; }
  .tarea.warm { fill: var(--warm); opacity: 0.12; }
  .tdot { fill: var(--panel); stroke: var(--accent); stroke-width: 2; }
  .tdot.warm { stroke: var(--warm); }
  /* 표본이 없는 초. 선을 잇지 않고 이 띠만 남는다. */
  .tgap { fill: var(--muted); opacity: 0.1; }
  .cross { stroke: var(--accent); }
  .crossband { fill: var(--accent); opacity: 0.11; }
  .markline { stroke: var(--ink-2); stroke-dasharray: 2 3; opacity: 0.5; }
  .axisrow { position: relative; height: 14px; margin-top: 2px; }
  .axisrow .ax { position: absolute; top: 0; font-size: 10px; color: var(--muted); font-family: ui-monospace, monospace; }
  .marks { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; align-items: center; }
  .marks::before { content: "표식"; font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
  .mk {
    font: inherit; font-size: 12px; cursor: pointer; color: var(--ink-2); background: var(--panel);
    border: 1px dashed var(--line); border-radius: 5px; padding: 3px 9px;
    display: inline-flex; gap: 7px; align-items: baseline;
  }
  .mk:hover, .mk:focus-visible { border-color: var(--accent); color: var(--ink); outline: none; }
  .mk-t { color: var(--muted); font-size: 11px; }

  /* ---------- 표 ---------- */
  table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.t th { text-align: left; font-weight: 500; color: var(--muted); padding: 5px 0; width: 42%; }
  table.t td { padding: 5px 0; border-bottom: 1px solid var(--line-2); }
  table.t th { border-bottom: 1px solid var(--line-2); }
  table.t tr:last-child th, table.t tr:last-child td { border-bottom: 0; }
  table.t td.r { text-align: right; }
  .ctitle { font-size: 13px; font-weight: 610; margin-bottom: 8px; }
  .csub { font-size: 11.5px; color: var(--muted); font-weight: 400; margin-left: 6px; }
  .none-t { color: var(--muted); font-style: italic; }

  /* ---------- 막대 리스트 (코어/온도) ---------- */
  .blist { display: grid; gap: 5px; font-size: 12px; }
  .brow { display: grid; grid-template-columns: 58px minmax(0, 1fr) 60px; align-items: center; gap: 9px; }
  .brow .bl { color: var(--ink-2); }
  .brow .bt { height: 8px; background: var(--line-2); border-radius: 2px; overflow: hidden; }
  .brow .bt i { display: block; height: 100%; background: var(--accent); opacity: 0.65; }
  .brow .bt i.warm { background: var(--warm); }
  .brow .bv { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ---------- 툴팁 ---------- */
  #tip {
    position: fixed; pointer-events: none; z-index: 50; opacity: 0; transition: opacity 90ms ease;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 11px; font-size: 12.5px; box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18); min-width: 128px;
  }
  #tip .t-h { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  #tip .t-v { font-size: 16px; font-weight: 640; }
  #tip .t-s { font-size: 11.5px; color: var(--ink-2); margin-top: 2px; }
  [hidden] { display: none !important; }
</style>

<div class="shell">
  <nav>
    <div class="brand">
      <div class="b1" id="nv-app"></div>
      <div class="b2" id="nv-sess"></div>
    </div>
    <button class="navbtn" data-tab="summary" aria-current="true">요약</button>
    <button class="navbtn" data-tab="env">기기</button>
  </nav>

  <main>
    <!-- ================= 요약 ================= -->
    <div id="tab-summary">
      <div class="top">
        <h1 id="s-name"></h1>
        <span class="kv"><i>앱</i><span id="s-app"></span></span>
        <span class="kv"><i>기기</i><span id="s-dev"></span></span>
        <span class="kv"><i>측정</i><span class="num" id="s-when"></span></span>
      </div>
      <div class="flags" id="s-flags"></div>

      <div class="tiles" id="tiles"></div>

      <!-- 렌더 -->
      <div class="sec">
        <h2>렌더 <em id="h-frame-src"></em></h2>
        <div class="card">
          <div class="dist-head">
            <div>
              <div class="lead">프레임 지속 시간 분포</div>
              <div class="sub"><span class="num" id="d-total"></span> 프레임 · 화면 <span class="num" id="d-hz"></span>Hz</div>
            </div>
            <div class="pcts" id="d-pcts"></div>
          </div>
          <div class="dist-scroll"><svg id="dist" role="img" aria-label="프레임 지속 시간 버킷 분포"></svg></div>
        </div>
      </div>

      <div class="marks" id="marks"></div>

      <!-- CPU -->
      <div class="sec">
        <h2>CPU</h2>
        <div class="grid2">
          <div id="slot-cpu"></div>
          <div id="slot-devcpu"></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div class="card">
            <div class="ctitle">기기 코어별 사용률<span class="csub">세션 전체 집계</span></div>
            <div class="blist" id="cores"></div>
          </div>
          <div class="card"><div class="ctitle">클러스터 주파수<span class="csub">avg / max</span></div><table class="t num" id="t-freq"></table></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div class="card"><div class="ctitle">앱 CPU 시간</div><table class="t num" id="t-cpuapp"></table></div>
          <div class="card"><div class="ctitle">기기 CPU</div><table class="t num" id="t-cpudev"></table></div>
        </div>
      </div>

      <!-- 메모리 -->
      <div class="sec">
        <h2>메모리</h2>
        <div class="grid2">
          <div id="slot-mem"></div>
          <div id="slot-sysmem"></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div class="card">
            <div class="ctitle">앱 RSS 구성<span class="csub">min / avg / max</span></div>
            <table class="t num" id="t-rss"></table>
          </div>
          <div class="card"><div class="ctitle">스왑</div><table class="t num" id="t-swap"></table></div>
        </div>
        <div class="grid2" style="margin-top:10px">
          <div class="card"><div class="ctitle">기기 메모리<span class="csub">세션 중 min / max</span></div><table class="t num" id="t-sysmem"></table></div>
        </div>
      </div>

      <!-- 로그 -->
      <div class="sec">
        <h2>로그 <em id="h-log-src"></em></h2>
        <div class="grid2">
          <div id="slot-log"></div>
          <div class="card">
            <div class="ctitle">우선순위별<span class="csub">앱 / 기기 전체</span></div>
            <table class="t num" id="t-log"></table>
          </div>
        </div>
      </div>

      <!-- 네트워크 · 시작 · 온도 -->
      <div class="sec">
        <h2>네트워크 · 시작 · 온도</h2>
        <div class="grid3">
          <div class="card"><div class="ctitle">네트워크<span class="csub">uid 델타 · 총량</span></div><table class="t num" id="t-net"></table></div>
          <div class="card"><div class="ctitle">시작<span class="csub">am start -W</span></div><table class="t num" id="t-start"></table></div>
          <div class="card"><div class="ctitle">온도<span class="csub">전 → 후</span></div><div class="blist" id="therm"></div></div>
        </div>
      </div>

      <!-- 오버헤드 -->
      <div class="sec">
        <h2>측정 자신의 비용</h2>
        <div class="grid2"><div class="card"><table class="t num" id="t-over"></table></div></div>
      </div>
    </div>

    <!-- ================= 기기 ================= -->
    <div id="tab-env" hidden>
      <div class="top"><h1>기기 · 앱 환경</h1></div>
      <div class="grid2">
        <div class="card"><div class="ctitle" id="e-model"></div><table class="t" id="t-dev"></table></div>
        <div class="card"><div class="ctitle">앱</div><table class="t" id="t-app"></table></div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="card"><div class="ctitle">화면</div><table class="t" id="t-screen"></table></div>
        <div class="card"><div class="ctitle">CPU</div><table class="t" id="t-cpuinfo"></table></div>
      </div>
      <div class="grid2" style="margin-top:10px">
        <div class="card"><div class="ctitle">기기 상태<span class="csub">세션 전 → 후</span></div><table class="t" id="t-state"></table></div>
        <div class="card"><div class="ctitle">도구</div><table class="t" id="t-tool"></table></div>
      </div>
    </div>
  </main>
</div>

<div id="tip" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const nf = (n, d = 0) => Number(n).toLocaleString('ko-KR', { minimumFractionDigits: d, maximumFractionDigits: d });
  const mb = (kb, d = 0) => nf(kb / 1024, d);
  const gb = (kb, d = 1) => nf(kb / 1048576, d);
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const rows = (arr) => arr.map(([k, v]) => `<tr><th>${k}</th><td class="r">${v}</td></tr>`).join('');
  const NONE = '<span class="none-t">수집 안 함</span>';

  /* ---------- 탭 ---------- */
  const TABS = ['summary', 'env'];
  for (const b of document.querySelectorAll('.navbtn')) {
    b.addEventListener('click', () => {
      for (const o of document.querySelectorAll('.navbtn')) o.setAttribute('aria-current', String(o === b));
      for (const t of TABS) $('tab-' + t).hidden = b.dataset.tab !== t;
      scrollTo(0, 0);
    });
  }

  /* ---------- 헤더 ---------- */
  const dev = D.dev, app = D.app;
  $('nv-app').textContent = `${app.label} ${app.version_name}`;
  $('nv-sess').textContent = `${D.session.name} · ${D.session.id}`;
  $('s-name').textContent = D.session.name;
  $('s-app').textContent = `${app.label} ${app.version_name}`;
  $('s-dev').textContent = `${dev.model} · Android ${dev.android_release}`;
  $('s-when').textContent = new Date(D.session.started_at).toLocaleString('ko-KR') + ` · ${(D.session.duration_ms / 1000).toFixed(1)}s`;

  const flags = [];
  for (const [k, v] of Object.entries({ frame: D.frame, cpu: D.cpu, memory: D.memory, log: D.log }))
    if (v.status !== 'collected') flags.push([`${k} · ${v.status}${v.rc ? ' · ' + v.rc : ''}`, false]);
  for (const w of D.warnings) flags.push([w.message, true]);
  flags.push([`측정 창 안 adb ${D.overhead.adb_commands_during_session}회`, false]);
  $('s-flags').innerHTML = flags.map(([t, w]) => `<span class="flag${w ? ' warn' : ''}">${esc(t)}</span>`).join('');

  /* ---------- 요약 타일 ---------- */
  const durS = D.session.duration_ms / 1000;
  $('tiles').innerHTML = [
    ['프레임', nf(D.frame.total), '개', `p50 ${D.frame.pct.p50}ms · 최대 ${D.frame.max}ms`],
    ['앱 CPU', nf(D.cpu.app.total_ms / 1000, 1), '초', `기기 대비 ${D.cpu.app.share_of_device_cpu_pct}%`],
    ['앱 RSS 최대', mb(D.memory.rss.max_kb), 'MB', `평균 ${mb(D.memory.rss.avg_kb)}MB · peak ${mb(D.memory.peak)}MB`],
    ['다운로드', nf(D.network.rx_bytes / 1048576, 1), 'MB', `업로드 ${nf(D.network.tx_bytes / 1024)}KB`],
    ['시작', nf(D.startup.total_time_ms), 'ms', `${D.startup.launch_state}`],
    ['경고·에러', nf(D.log.total), '건', `에러 ${nf(D.log.by.error)} · 치명 ${nf(D.log.by.fatal)}`],
  ].map(([k, v, u, s]) => `<div class="tile"><div class="tk">${k}</div><div class="tv num">${v}<u>${u}</u></div><div class="ts num">${s}</div></div>`).join('');

  /* ---------- 툴팁 ---------- */
  const tip = $('tip');
  function showTip(x, y, head, val, sub) {
    tip.innerHTML = `<div class="t-h">${head}</div><div class="t-v num">${val}</div>${sub ? `<div class="t-s num">${sub}</div>` : ''}`;
    tip.style.opacity = '1';
    const r = tip.getBoundingClientRect();
    let left = x + 16, top = y + 16;
    if (left + r.width > innerWidth - 8) left = x - r.width - 14;
    if (top + r.height > innerHeight - 8) top = y - r.height - 14;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  const hideTip = () => { tip.style.opacity = '0'; };

  /* ================= 분포 ================= */
  $('h-frame-src').textContent = D.frame.src;
  (function () {
    const all = D.frame.buckets;
    let last = 0; all.forEach((b, i) => { if (b.count > 0) last = i; });
    const used = all.slice(0, last + 1);

    const segs = []; let cur = [];
    for (let i = 0; i < used.length; i++) {
      const rs = i;
      if (used[i].count === 0) {
        let j = i; while (j < used.length && used[j].count === 0) j++;
        if (j - i >= 5 && cur.length) { segs.push(cur); segs.push({ gap: [used[i].from_ms, used[j - 1].to_ms ?? used[j - 1].from_ms] }); cur = []; i = j - 1; continue; }
      }
      cur.push(used[rs]);
    }
    if (cur.length) segs.push(cur);

    const BW = 15, GAPW = 36, PAD = { l: 46, r: 14, t: 16, b: 34 };
    let n = 0; segs.forEach((s) => { n += Array.isArray(s) ? s.length : 0; });
    const gaps = segs.filter((s) => !Array.isArray(s)).length;
    const W = PAD.l + n * BW + gaps * GAPW + PAD.r, H = 240, PH = H - PAD.t - PAD.b;
    const maxC = Math.max(...used.map((b) => b.count)), total = D.frame.total;

    const svg = $('dist');
    svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let h = '', x = PAD.l, idx = 0, cum = 0; const xOf = {}, bars = [];

    for (let k = 0; k <= 4; k++) {
      const y = PAD.t + PH - (PH * k) / 4;
      h += `<line class="axis-line" x1="${PAD.l}" y1="${y}" x2="${W - PAD.r}" y2="${y}" opacity="${k === 0 ? 1 : 0.45}"/>`;
      h += `<text class="tick mono" x="${PAD.l - 7}" y="${y + 3.5}" text-anchor="end">${Math.round((maxC / 4) * k)}</text>`;
    }
    for (const seg of segs) {
      if (!Array.isArray(seg)) {
        h += `<line class="brk" x1="${x + GAPW / 2 - 5}" y1="${PAD.t}" x2="${x + GAPW / 2 - 5}" y2="${PAD.t + PH}" stroke-dasharray="2 4"/>`;
        h += `<text class="brk-t" x="${x + GAPW / 2}" y="${PAD.t + PH + 14}" text-anchor="middle">⋯</text>`;
        h += `<text class="brk-t" x="${x + GAPW / 2}" y="${PAD.t + PH + 26}" text-anchor="middle">${seg.gap[0]}–${seg.gap[1] ?? '∞'} 없음</text>`;
        x += GAPW; continue;
      }
      for (const b of seg) {
        const bh = maxC ? (b.count / maxC) * PH : 0;
        bars.push({ i: idx, x, b, cumBefore: cum }); cum += b.count;
        h += `<rect class="bar dim" data-i="${idx}" x="${x + 1}" y="${PAD.t + PH - bh}" width="${BW - 2}" height="${Math.max(bh, b.count > 0 ? 1.5 : 0)}" rx="1"/>`;
        xOf[b.from_ms] = x + BW / 2; idx++; x += BW;
      }
    }
    for (const b of used) {
      if (xOf[b.from_ms] === undefined) continue;
      if (b.from_ms % 10 !== 0 && b.from_ms <= 100) continue;
      h += `<text class="tick mono" x="${xOf[b.from_ms]}" y="${PAD.t + PH + 14}" text-anchor="middle">${b.from_ms}</text>`;
    }
    h += `<text class="tick" x="${W - PAD.r}" y="${H - 4}" text-anchor="end">프레임 지속 시간 (ms)</text>`;

    const pcs = [['p50', D.frame.pct.p50], ['p90', D.frame.pct.p90], ['p95', D.frame.pct.p95], ['p99', D.frame.pct.p99]];
    for (const [name, v] of pcs) {
      const hit = bars.find((bb) => bb.b.to_ms !== null && v >= bb.b.from_ms && v < bb.b.to_ms);
      if (!hit) continue;
      const px = hit.x + ((v - hit.b.from_ms) / (hit.b.to_ms - hit.b.from_ms)) * BW;
      h += `<line class="pline" x1="${px}" y1="${PAD.t - 4}" x2="${px}" y2="${PAD.t + PH}"/>`;
      h += `<text class="plabel" x="${px + 3}" y="${PAD.t + 4}">${name}</text>`;
    }
    svg.innerHTML = h;

    $('d-total').textContent = nf(total);
    $('d-hz').textContent = dev.display.active_refresh_rate_hz;
    $('d-pcts').innerHTML = pcs.concat([['평균', D.frame.mean], ['최대', D.frame.max]])
      .map(([k, v]) => `<div class="pct">${k}<b class="num">${v}<u> ms</u></b></div>`).join('');

    const rects = [...svg.querySelectorAll('.bar')];
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect(), mx = e.clientX - r.left;
      let best = null, bd = 1e9;
      for (const bb of bars) { const d2 = Math.abs(mx - (bb.x + BW / 2)); if (d2 < bd && d2 < BW) { bd = d2; best = bb; } }
      if (!best) { rects.forEach((rr) => rr.classList.replace('hot', 'dim')); hideTip(); return; }
      rects.forEach((rr) => { rr.classList.toggle('hot', +rr.dataset.i === best.i); rr.classList.toggle('dim', +rr.dataset.i !== best.i); });
      const b = best.b;
      showTip(e.clientX, e.clientY,
        b.to_ms === null ? `${b.from_ms} ms 이상` : `${b.from_ms} – ${b.to_ms} ms`,
        `${nf(b.count)} 프레임 · ${((b.count / total) * 100).toFixed(1)}%`,
        `누적 ${(((best.cumBefore + b.count) / total) * 100).toFixed(1)}%`);
    });
    svg.addEventListener('mouseleave', () => { rects.forEach((rr) => rr.classList.replace('hot', 'dim')); hideTip(); });
  })();

  /* ================= 타임라인 ================= */
  const T_MAX = Math.ceil(D.session.duration_ms / 1000);
  const series = (list, key, missing) => {
    const m = new Map(list.map((r) => [r.t_s, r[key]]));
    const out = []; for (let t = 0; t <= T_MAX; t++) out.push(m.has(t) ? m.get(t) : missing);
    return out;
  };

  const CARDS = [
    {
      k: 'cpu', slot: 'slot-cpu', name: '앱 CPU', unit: '% (1코어 = 100%)', tone: '',
      v: series(D.cpu.timeline, 'app_cpu_ms', null).map((v) => (v === null ? null : v / 10)),
      fmt: (v) => `${nf(v, 1)}%`, sub2: (v) => `${nf(v * 10)} ms / 초`,
    },
    {
      // 앱 쪽은 시간(ms)이고 기기 쪽은 백분율이다 — 분모가 다르므로 단위 표기로 갈라 둔다.
      k: 'devcpu', slot: 'slot-devcpu', name: '기기 CPU', unit: '% (전 코어 = 100%)', tone: '',
      v: series(D.cpu.device_timeline ?? [], 'busy_pct', null),
      fmt: (v) => `${nf(v, 1)}%`,
    },
    {
      k: 'mem', slot: 'slot-mem', name: '앱 RSS', unit: 'MB', tone: 'warm',
      v: series(D.memory.timeline, 'rss_kb', null).map((v) => (v === null ? null : v / 1024)),
      fmt: (v) => `${nf(v, 1)} MB`,
    },
    {
      k: 'sysmem', slot: 'slot-sysmem', name: '기기 가용 메모리', unit: 'MB', tone: 'warm',
      v: series(D.memory.system_timeline ?? [], 'mem_available_kb', null).map((v) => (v === null ? null : v / 1024)),
      sub2v: series(D.memory.system_timeline ?? [], 'mem_free_kb', null),
      fmt: (v) => `${nf(v, 0)} MB`,
    },
    {
      k: 'log', slot: 'slot-log', name: '경고 · 에러', unit: '건 / 초', tone: '',
      v: series(D.log.timeline, 'count', 0), sub: series(D.log.timeline, 'error', 0),
      fmt: (v, s) => `${nf(v)} 건${s ? ` (에러 ${nf(s)})` : ''}`,
    },
  ];

  const CW = 520, CH = 80, CP = { t: 8, b: 4 };

  /**
   * 값 배열을 **끊어진 선 조각들**로 바꾼다.
   *
   * `null`(표본 없음)에서 선을 잇지 않는 것이 이 함수의 존재 이유다 — 이으면 재지 않은 구간에
   * 직선이 그어지고 그 직선은 데이터처럼 보인다. 조각마다 별도 path 를 낸다.
   */
  function lineSegments(v, xOf, yOf) {
    const segs = [];
    let cur = [];
    v.forEach((val, t) => {
      if (val === null || val === undefined) {
        if (cur.length) segs.push(cur);
        cur = [];
        return;
      }
      cur.push([xOf(t), yOf(val)]);
    });
    if (cur.length) segs.push(cur);
    return segs;
  }

  const pathOf = (pts) =>
    pts.map(([x, y], i) => `${i === 0 ? 'M' : 'L'}${x.toFixed(1)},${y.toFixed(1)}`).join(' ');

  for (const c of CARDS) {
    const vals = c.v.filter((x) => x !== null);
    const max = vals.length ? Math.max(...vals) : 1;
    const bw = CW / (T_MAX + 1), ph = CH - CP.t - CP.b;
    const xOf = (t) => t * bw + bw / 2;
    const yOf = (v) => CP.t + ph - (max ? (v / max) * ph : 0);
    c._xOf = xOf;
    c._yOf = yOf;

    let h = `<rect x="0" y="${CP.t + ph}" width="${CW}" height="1" fill="var(--line)"/>`;

    // 표본 없는 초는 띠로 남긴다 — 선이 끊긴 이유가 화면에 있어야 한다.
    c.v.forEach((v, t) => {
      if (v === null) h += `<rect class="tgap" x="${t * bw}" y="${CP.t}" width="${bw}" height="${ph}"/>`;
    });

    for (const pts of lineSegments(c.v, xOf, yOf)) {
      if (pts.length === 1) {
        // 조각이 한 점이면 선을 못 그린다. 점으로 남긴다 — 버리면 잰 값이 사라진다.
        h += `<circle class="tdot ${c.tone}" cx="${pts[0][0].toFixed(1)}" cy="${pts[0][1].toFixed(1)}" r="1.8"/>`;
        continue;
      }
      const first = pts[0], last = pts[pts.length - 1];
      h += `<path class="tarea ${c.tone}" d="${pathOf(pts)} L${last[0].toFixed(1)},${CP.t + ph} L${first[0].toFixed(1)},${CP.t + ph} Z"/>`;
      h += `<path class="tline ${c.tone}" d="${pathOf(pts)}"/>`;
    }

    // 에러 로그는 같은 축 위의 **두 번째 선**이다. 쌓지 않는다 — 합이 아니라 부분집합이라.
    if (c.sub) {
      const errAligned = c.sub.map((x, t) => (c.v[t] === null ? null : x));
      for (const pts of lineSegments(errAligned, xOf, yOf)) {
        if (pts.length > 1) h += `<path class="tline err" d="${pathOf(pts)}"/>`;
      }
    }

    for (const mk of D.session.marks) {
      const x = (mk.offset_ms / 1000) * bw;
      h += `<line class="markline" x1="${x}" y1="${CP.t - 4}" x2="${x}" y2="${CP.t + ph}"/>`;
    }
    h += `<circle class="tdot ${c.tone}" id="dot-${c.k}" cx="0" cy="0" r="3.2" opacity="0"/>`;
    h += `<rect class="crossband" id="band-${c.k}" x="0" y="${CP.t}" width="${bw}" height="${ph}" opacity="0"/>`;
    h += `<line class="cross" id="cross-${c.k}" x1="0" y1="${CP.t - 4}" x2="0" y2="${CP.t + ph}" opacity="0"/>`;
    h += `<rect x="0" y="0" width="${CW}" height="${CH}" fill="transparent"/>`;

    let axis = '';
    for (let t = 0; t <= T_MAX; t += 10) axis += `<span class="ax num" style="left:${(t / (T_MAX + 1)) * 100}%">${t}s</span>`;

    $(c.slot).innerHTML = `<div class="card" id="card-${c.k}">
      <div class="chead">
        <div><span class="name">${c.name}</span><span class="unit">${c.unit}</span></div>
        <div class="readout" id="ro-${c.k}">—</div>
      </div>
      <svg viewBox="0 0 ${CW} ${CH}" width="100%" height="${CH}" preserveAspectRatio="none" role="img" aria-label="${c.name} 초당 추이">${h}</svg>
      <div class="axisrow">${axis}</div>
    </div>`;
    c._bw = bw;
  }

  $('marks').innerHTML = D.session.marks
    .map((mk) => `<button class="mk" data-t="${Math.round(mk.offset_ms / 1000)}"><span class="mk-t num">${(mk.offset_ms / 1000).toFixed(1)}s</span>${esc(mk.label)}</button>`).join('');

  function setHover(t, srcKey, mx, my) {
    for (const c of CARDS) {
      const card = $('card-' + c.k), ro = $('ro-' + c.k);
      const band = $('band-' + c.k), cross = $('cross-' + c.k);
      if (t === null) {
        card.classList.remove('live'); ro.textContent = '—'; ro.classList.remove('on');
        band.setAttribute('opacity', 0); cross.setAttribute('opacity', 0);
        $('dot-' + c.k).setAttribute('opacity', 0); continue;
      }
      const v = c.v[t];
      band.setAttribute('x', t * c._bw); band.setAttribute('opacity', 1);
      cross.setAttribute('x1', c._xOf(t)); cross.setAttribute('x2', c._xOf(t)); cross.setAttribute('opacity', 1);
      card.classList.toggle('live', c.k === srcKey);
      // 선 위의 그 점을 짚어 준다. 값이 없는 초에는 점도 없다.
      const dot = $('dot-' + c.k);
      if (v === null) dot.setAttribute('opacity', 0);
      else {
        dot.setAttribute('cx', c._xOf(t)); dot.setAttribute('cy', c._yOf(v)); dot.setAttribute('opacity', 1);
      }
      if (v === null) { ro.innerHTML = '<span class="none">표본 없음</span>'; ro.classList.remove('on'); }
      else { ro.textContent = c.fmt(v, c.sub ? c.sub[t] : 0); ro.classList.add('on'); }
    }
    if (t === null) { hideTip(); return; }
    const c = CARDS.find((x) => x.k === srcKey), v = c.v[t];
    const near = D.session.marks.find((mk) => Math.abs(mk.offset_ms / 1000 - t) < 1);
    const extra = c.sub2 && v !== null ? c.sub2(v)
      : c.sub2v && c.sub2v[t] !== null && c.sub2v[t] !== undefined ? `free ${nf(c.sub2v[t] / 1024, 0)} MB`
      : ''
    const sub = [extra, near ? `표식 · ${near.label}` : ''].filter(Boolean).join(' · ');
    showTip(mx, my, `t = ${t}s · ${c.name}`, v === null ? '표본 없음' : c.fmt(v, c.sub ? c.sub[t] : 0), sub);
  }

  for (const c of CARDS) {
    const svg = $('card-' + c.k).querySelector('svg');
    svg.addEventListener('mousemove', (e) => {
      const r = svg.getBoundingClientRect();
      const t = Math.max(0, Math.min(T_MAX, Math.floor(((e.clientX - r.left) / r.width) * (T_MAX + 1))));
      setHover(t, c.k, e.clientX, e.clientY);
    });
    svg.addEventListener('mouseleave', () => setHover(null));
  }
  for (const btn of document.querySelectorAll('#marks .mk')) {
    btn.addEventListener('mouseenter', () => {
      const r = btn.getBoundingClientRect();
      setHover(+btn.dataset.t, 'cpu', r.left + r.width / 2, r.bottom);
    });
    btn.addEventListener('mouseleave', () => setHover(null));
  }

  /* ================= CPU 표 ================= */
  const maxCore = Math.max(...D.cpu.per_core.map((c) => c.busy_pct));
  $('cores').innerHTML = D.cpu.per_core.map((c) =>
    `<div class="brow"><span class="bl mono">cpu${c.cpu}</span><span class="bt"><i style="width:${(c.busy_pct / maxCore) * 100}%"></i></span><span class="bv">${c.busy_pct}%</span></div>`).join('');

  $('t-cpuapp').innerHTML = rows([
    ['user', `${nf(D.cpu.app.user_ms)} ms`], ['kernel', `${nf(D.cpu.app.kernel_ms)} ms`],
    ['합계', `${nf(D.cpu.app.total_ms)} ms`], ['기기 CPU 대비', `${D.cpu.app.share_of_device_cpu_pct}%`],
    ['표본', `${D.cpu.app.samples}회 / ${nf(D.cpu.app.sampled_ms)} ms`],
  ]);
  $('t-cpudev').innerHTML = rows([
    ['전체 사용률', `${D.cpu.device_busy}%`], ['코어', `${dev.cpu.core_count}개`],
    ['SoC', `${dev.soc_manufacturer} ${dev.soc_model}`], ['샘플 구간', `${nf(D.cpu.device_sampled_ms)} ms`],
    ['초당 추이', `${(D.cpu.device_timeline ?? []).length}점`],
  ]);
  $('t-freq').innerHTML = rows(dev.cpu.clusters.map((cl) => {
    const fs = D.cpu.freq.filter((f) => cl.cpus.includes(f.cpu));
    const avg = fs.reduce((a, b) => a + b.avg_khz, 0) / (fs.length || 1);
    return [`cpu${cl.cpus[0]}–${cl.cpus[cl.cpus.length - 1]}`, `${nf(avg / 1000)} / ${nf(cl.max_freq_khz / 1000)} MHz`];
  }));

  /* ================= 메모리 표 ================= */
  const R = D.memory;
  $('t-rss').innerHTML = rows([
    ['RSS 전체', `${mb(R.rss.min_kb)} / ${mb(R.rss.avg_kb)} / ${mb(R.rss.max_kb)} MB`],
    ['익명 (힙·스택)', `${mb(R.anon.min_kb)} / ${mb(R.anon.avg_kb)} / ${mb(R.anon.max_kb)} MB`],
    ['파일 (코드·매핑)', `${mb(R.file.min_kb)} / ${mb(R.file.avg_kb)} / ${mb(R.file.max_kb)} MB`],
    ['워터마크 peak', `${mb(R.peak)} MB`],
    ['표본', `${R.samples}회`],
  ]);
  $('t-sysmem').innerHTML = rows([
    ['전체', `${gb(R.system.mem_total_kb)} GB`],
    ['가용', `${mb(R.system.mem_available.min_kb)} – ${mb(R.system.mem_available.max_kb)} MB`],
    ['free', `${mb(R.system.mem_free.min_kb)} – ${mb(R.system.mem_free.max_kb)} MB`],
    ['cached', `${mb(R.system.cached.min_kb)} – ${mb(R.system.cached.max_kb)} MB`],
    ['초당 추이', `${(R.system_timeline ?? []).length}점`],
  ]);
  $('t-swap').innerHTML = rows([
    ['전체', `${gb(R.system.swap_total_kb)} GB`],
    ['free', `${mb(R.system.swap_free.min_kb)} – ${mb(R.system.swap_free.max_kb)} MB`],
    ['사용', `${mb(R.system.swap_total_kb - R.system.swap_free.min_kb)} MB (최대)`],
  ]);

  /* ================= 로그 · 네트워크 · 시작 · 온도 ================= */
  $('h-log-src').textContent = `최소 우선순위 ${D.log.min_prio}`;
  $('t-log').innerHTML = rows([
    ['warn', `${nf(D.log.by.warn)} / ${nf(D.log.device_by.warn)}`],
    ['error', `${nf(D.log.by.error)} / ${nf(D.log.device_by.error)}`],
    ['fatal', `${nf(D.log.by.fatal)} / ${nf(D.log.device_by.fatal ?? 0)}`],
    ['합계', `${nf(D.log.total)} / ${nf(D.log.device_total)}`],
    ['원문', NONE],
  ]);
  $('t-net').innerHTML = rows([
    ['다운로드', `${nf(D.network.rx_bytes / 1048576, 1)} MB`],
    ['업로드', `${nf(D.network.tx_bytes / 1024)} KB`],
    ['패킷 rx / tx', `${nf(D.network.rx_packets)} / ${nf(D.network.tx_packets)}`],
    ['평균 다운로드', `${nf(D.network.rx_bytes / 1048576 / durS, 2)} MB/s`],
    ['wifi · mobile 분리', NONE],
    ['초당 추이', NONE],
  ]);
  $('t-start').innerHTML = rows([
    ['TotalTime', `${nf(D.startup.total_time_ms)} ms`],
    ['WaitTime', `${nf(D.startup.wait_time_ms)} ms`],
    ['LaunchState', D.startup.launch_state],
    ['status', D.startup.status],
    ['런처 액티비티', `<span class="mono" style="font-size:11px">${esc(app.launcher_activity.split('.').pop())}</span>`],
  ]);
  const maxD = Math.max(...D.thermal.map((z) => Math.abs(z.d))) || 1;
  $('therm').innerHTML = D.thermal.slice().sort((a, b) => b.d - a.d).map((z) =>
    `<div class="brow"><span class="bl">${z.name}</span><span class="bt"><i class="warm" style="width:${(Math.abs(z.d) / maxD) * 100}%"></i></span><span class="bv">${z.b}→${z.a}°C</span></div>`).join('');

  $('t-over').innerHTML = rows([
    ['측정 창 안 adb 명령', `${D.overhead.adb_commands_during_session}회`],
    ['추적 프로세스 CPU', `${nf(D.overhead.tracing_processes_cpu_time_ms)} ms (${D.overhead.tracing_processes_cpu_share_pct}%)`],
    ['추적 프로세스 peak RSS', `${mb(D.overhead.tracing_processes_peak_rss_kb, 1)} MB`],
    ['트레이스 버퍼 유실', D.overhead.trace_buffer_overrun ? '있음' : '없음'],
  ]);

  /* ================= 기기 탭 ================= */
  $('e-model').textContent = dev.model;
  $('t-dev').innerHTML = rows([
    ['Android 버전', dev.android_release], ['SDK', dev.sdk_int],
    ['제조사', dev.manufacturer], ['모델', dev.model],
    ['SoC', `${dev.soc_manufacturer} ${dev.soc_model}`],
    ['ABI', `<span class="mono" style="font-size:11px">${dev.abis.join(' · ')}</span>`],
    ['RAM', `${gb(dev.memory_total_kb)} GB`],
    ['빌드', `<span class="mono" style="font-size:10.5px">${esc(dev.build_fingerprint)}</span>`],
  ]);
  $('t-app').innerHTML = rows([
    ['이름', app.label], ['버전', `${app.version_name} (${nf(app.version_code)})`],
    ['패키지', `<span class="mono" style="font-size:11px">${esc(app.package)}</span>`],
    ['런처 액티비티', `<span class="mono" style="font-size:11px">${esc(app.launcher_activity)}</span>`],
    ['설치 경로', app.install_source], ['uid · pid', `${app.uid} · ${app.pid}`],
    ['렌더 프로세스', `<span class="mono" style="font-size:11px">${esc(app.render_process)}</span>`],
    [
      'debuggable',
      app.debuggable === null
        ? NONE
        : app.debuggable
          ? '<b style="color:var(--alert)">true</b> — 릴리스 빌드가 아님'
          : 'false',
    ],
    ['large heap', app.large_heap === null ? NONE : String(app.large_heap)],
    ['min · target API', app.min_sdk === null ? NONE : `${app.min_sdk} · ${app.target_sdk}`],
    ['실행 ABI', app.primary_cpu_abi === null ? NONE : `<span class="mono" style="font-size:11px">${esc(app.primary_cpu_abi)}</span>`],
    ['locale · densities', NONE],
  ]);
  const dp = (px) => Math.round((px / dev.display.density_dpi) * 160);
  $('t-screen').innerHTML = rows([
    ['해상도', `${dev.display.width_px} × ${dev.display.height_px} px`],
    ['dp 환산', `${dp(dev.display.width_px)} × ${dp(dev.display.height_px)} dp`],
    ['밀도', `${dev.display.density_dpi} dpi`],
    ['현재 주사율', `${dev.display.active_refresh_rate_hz} Hz`],
    ['지원 주사율', `${dev.display.supported_refresh_rates_hz.join(' · ')} Hz`],
    ['방향', dev.display.orientation ?? NONE],
    ['크기 구간', dev.display.size_class ?? NONE],
    ['OpenGL ES', dev.display.opengl_es_version ?? NONE],
  ]);
  $('t-cpuinfo').innerHTML = rows([['코어 수', `${dev.cpu.core_count}개`]].concat(
    dev.cpu.clusters.map((cl) => [`cpu${cl.cpus.join(',')}`, `최대 ${nf(cl.max_freq_khz / 1000)} MHz`]))
  );
  const st = (k, f) => `${f ? f(D.before[k]) : D.before[k]} → ${f ? f(D.after[k]) : D.after[k]}`;
  $('t-state').innerHTML = rows([
    ['배터리', st('battery_level', (v) => v + '%')],
    ['배터리 온도', st('battery_temp_c', (v) => v + '°C')],
    ['충전 · 연결', `${D.before.charging ? '충전 중' : '아님'} · ${D.before.connection}`],
    ['네트워크', st('network')],
    ['화면 밝기', st('screen_brightness')],
    ['절전 모드', st('power_save_mode', (v) => (v ? '켬' : '끔'))],
    ['애니메이션 배율', st('animator_duration_scale')],
    ['가용 메모리', st('mem_available_kb', (v) => mb(v) + 'MB')],
  ]);
  $('t-tool').innerHTML = rows([
    ['도구', `${D.tool.name} ${D.tool.version}`],
    ['세션 id', `<span class="mono">${D.session.id}</span>`],
    ['시작 옵션', `launch ${D.session.options.launch ? '켬' : '끔'}`],
    ['표식', `${D.session.marks.length}개`],
    ['호스트', D.tool.host ? `${D.tool.host.os} · ${D.tool.host.arch}` : NONE],
    ['node', D.tool.host?.node ?? NONE],
  ]);
})();
</script>
