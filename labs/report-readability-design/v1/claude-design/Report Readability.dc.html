<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&amp;family=Barlow+Condensed:wght@500;600;700&amp;display=swap">
<link rel="stylesheet" href="_ds/industry-dead3d66-f6b4-48d1-8e80-511171bc624a/styles.css">
<script src="_ds/industry-dead3d66-f6b4-48d1-8e80-511171bc624a/_ds_bundle.js"></script>

</helmet>
<div ref="{{ rootRef }}" onClick="{{ onRootClick }}" style="min-height:100vh;background:var(--color-bg)"></div>
<sc-if value="{{ showPicker }}" hint-placeholder-val="{{ false }}">
  <div class="diag-picker" aria-label="시안 상태">
    <sc-for list="{{ picks }}" as="p" hint-placeholder-count="8">
      <button type="button" aria-current="{{ p.on }}" onClick="{{ p.go }}">{{ p.id }}</button>
    </sc-for>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:980},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;summary&quot;,&quot;missing&quot;,&quot;compile&quot;,&quot;end-null&quot;,&quot;legacy&quot;,&quot;device&quot;,&quot;diag&quot;,&quot;diag-noapp&quot;],&quot;default&quot;:&quot;summary&quot;,&quot;tsType&quot;:&quot;'summary' | 'missing' | 'compile' | 'end-null' | 'legacy' | 'device' | 'diag' | 'diag-noapp'&quot;,&quot;section&quot;:&quot;상태&quot;}}">
// 시계열 viewBox 폭 = 카드 안쪽 폭 ÷ (13/12) — 눈금 12 단위가 13px 로 렌더
const SERIES = { w: 300 }
const STATES = ['summary', 'missing', 'compile', 'end-null', 'legacy', 'device', 'diag', 'diag-noapp']
const NONE_NULL = '값 없음'
const NONE_MISS = '수집 안 함'
const MISSING = Symbol('missing')
const BADGE = { unsupported: '기기 미지원', skipped: '건너뜀', failed: '실패' }
const THERMAL = ['NONE', 'LIGHT', 'MODERATE', 'SEVERE', 'CRITICAL', 'EMERGENCY', 'SHUTDOWN']

function get(o, path) {
  let cur = o
  for (const seg of path.split('.')) {
    if (cur === null) return null
    if (cur === undefined || typeof cur !== 'object' || !(seg in cur)) return MISSING
    cur = cur[seg]
  }
  return cur
}
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ESC[c])
// 구분자 뒤에만 <wbr> — 글자 가운데서 끊지 않는다
const wbr = (s) => { let o = ''; for (const ch of String(s)) { o += ESC[ch] || ch; if ('/:$.;,_'.includes(ch)) o += '<wbr>' } return o }
const nf = (v, d = 0) => Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d })
const bytes = (b) => b < 1024 ? `${nf(b)} B` : b < 1048576 ? `${nf(b / 1024, 1)} kB` : b < 1073741824 ? `${nf(b / 1048576, 1)} MB` : `${nf(b / 1073741824, 2)} GB`
const mb = (kb) => `${nf(kb / 1024)} MB`
const mbTriple = (o) => `${nf(o.min_kb / 1024)} / ${nf(o.avg_kb / 1024)} / ${nf(o.max_kb / 1024)} MB`
const thr = (v) => `${THERMAL[v] ?? v} (${v})`
const yn = (v) => v === true ? '예' : v === false ? '아니오' : String(v)
const F = {
  raw: (v) => esc(v), wrap: (v) => wbr(v), int: (v) => nf(v), ms: (v) => `${nf(v)} ms`, pct: (v) => `${nf(v, 2)}%`,
  mb, mbTriple, gb: (v) => `${nf(v / 1048576, 1)} GB`, bytes, bool: yn, hz: (v) => `${nf(v)} Hz`, thr,
  list: (v) => Array.isArray(v) ? (v.length ? esc(v.join(', ')) : '없음') : esc(v),
  dots: (v) => Array.isArray(v) ? (v.length ? esc(v.join(' · ')) : '없음') : esc(v),
}
function niceMax(v) { if (v <= 0) return 1; const m = Math.pow(10, Math.floor(Math.log10(v))); return Math.ceil(v / (m / 2)) * (m / 2) }
const lbl = (word, path) => `<span class="rp-lbl">${esc(word)}</span><span class="rp-lbl-path">${wbr(path)}</span>`
const noneCode = (code) => code ? `<code class="rp-none-code">${esc(code)}</code>` : ''
const noneBody = (word, code) => `<div class="rp-none"><span>${word}</span>${noneCode(code)}</div>`
const secHead = (t) => `<h2 class="rp-section-head"><span>${esc(t)}</span><i></i></h2>`
const section = (t, inner) => `<section class="rp-section">${secHead(t)}<div class="rp-grid">${inner}</div></section>`

// 값 한 칸: 없는 것(수집 안 함)과 null(값 없음)을 가른다
function cell(v, f, code) {
  if (v === MISSING) return NONE_MISS
  if (v === null || v === undefined) return NONE_NULL + noneCode(code)
  return (F[f] || F.raw)(v)
}
// rows: [label(html), valueHtml, opts]
function pairsTable(rows) {
  return `<table class="rp-table"><tbody>${rows.map(([l, v, o = {}]) =>
    `<tr${o.title ? ` title="${esc(o.title)}"` : ''}><th>${l}</th><td class="num${o.mono ? ' mono' : ''}${o.wrap ? ' rp-wrap' : ''}">${v}</td><td class="rp-share num">${o.share || ''}</td></tr>`).join('')}</tbody></table>`
}

class Ctx {
  constructor(d) { this.d = d; this.none = 0 }
  metric(name) { const m = get(this.d, `metrics.${name}`); return m === MISSING ? MISSING : m }
  // 카드 하나. none: true 면 레일 배지에 센다
  card({ title, unit = '', span = 4, alt = false, m = null, body, none = false, extra = '' }) {
    if (none) this.none++
    const st = m && m !== MISSING ? m.status : null
    const badge = BADGE[st]
    const why = m && m !== MISSING && m.reason ? ` title="${esc(m.reason)}"` : ''
    const wide = span > 6 ? ' rp-span-wide' : ''
    return `<section class="rp-card${alt ? ' rp-card-alt' : ''}${wide}${extra}" style="grid-column: span ${span};"><header class="rp-card-head"><h3 class="rp-card-title"${why}>${esc(title)}</h3><span class="rp-card-unit">${esc(unit)}</span>${badge ? `<span class="rp-badge"${why}>${badge}</span>` : ''}</header>${body}</section>`
  }
  // 지표 카드: metrics.x 없음 · 배지 상태 · data null 을 먼저 거른다
  metricCard(name, opts, bodyFn) {
    const m = this.metric(name)
    if (m === MISSING) return this.card({ ...opts, m: null, body: noneBody(`${NONE_MISS} — metrics.${name} 없음`), none: true })
    if (BADGE[m.status] || m.data === null || m.data === undefined) return this.card({ ...opts, m, body: noneBody(NONE_NULL, m.reason_code), none: true })
    const r = bodyFn(m.data, m)
    if (r && r.none) return this.card({ ...opts, m, body: r.html, none: true })
    return this.card({ ...opts, m, body: typeof r === 'string' ? r : r.html })
  }
}

/* ── 시계열 ── */
function seriesBody(ctx, arr, o, m, maxT) {
  if (arr === MISSING) return { html: noneBody(`${NONE_MISS} — ${o.path} 없음`), none: true }
  if (arr === null) return { html: noneBody(NONE_NULL, m.reason_code), none: true }
  if (!Array.isArray(arr) || arr.length === 0) return noneBody('표본 없음')
  const tf = o.tf || ((v) => v)
  const pts = arr.filter((r) => r[o.field] != null).map((r) => [r.t_s, tf(r[o.field])])
  const sub = o.sub ? arr.filter((r) => r[o.sub] != null).map((r) => [r.t_s, tf(r[o.sub])]) : []
  const all = [...pts, ...sub].map((p) => p[1])
  const yMax = niceMax(Math.max(...all))
  const yMin = o.baseline === 'data' ? Math.max(0, Math.floor(Math.min(...all) / (yMax / 10)) * (yMax / 10)) : 0
  const W = SERIES.w, H = Math.max(150, Math.round(W * 0.42)), L = 46, R = 10, T = 12, B = 30
  const px = (t) => L + (t / maxT) * (W - L - R)
  const py = (v) => H - B - ((v - yMin) / (yMax - yMin || 1)) * (H - T - B)
  const path = (p) => p.map(([t, v], i) => `${i ? 'L' : 'M'}${px(t).toFixed(1)} ${py(v).toFixed(1)}`).join(' ')
  const ys = [yMin, (yMin + yMax) / 2, yMax]
  const xs = []; for (let t = 0; t <= maxT; t += 5) if (t === maxT || maxT - t >= 5 * 0.6) xs.push(t); if (xs[xs.length - 1] !== maxT) xs.push(maxT)
  const fa = (v) => v === 0 ? '0' : v >= 10 ? nf(Math.round(v)) : nf(v, 1)
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title)} 초당 추이">`
    + ys.map((v) => `<line class="rp-gridline" x1="${L}" x2="${W - R}" y1="${py(v).toFixed(1)}" y2="${py(v).toFixed(1)}"></line><text class="rp-tick" x="${L - 6}" y="${(py(v) + 4).toFixed(1)}" text-anchor="end">${fa(v)}</text>`).join('')
    + `<line class="rp-axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"></line><line class="rp-axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"></line>`
    + xs.map((t, i) => `<line class="rp-axis" x1="${px(t).toFixed(1)}" x2="${px(t).toFixed(1)}" y1="${H - B}" y2="${H - B + 3}"></line><text class="rp-tick" x="${px(t).toFixed(1)}" y="${H - 10}" text-anchor="${i === 0 ? 'start' : i === xs.length - 1 ? 'end' : 'middle'}">${t}s</text>`).join('')
    + (sub.length > 1 ? `<path class="rp-subline" d="${path(sub)}"></path>` : '')
    + `<path class="rp-line" d="${path(pts)}"></path></svg>`
  const vv = pts.map((p) => p[1])
  const fm = o.fmt || ((v) => nf(v))
  const readout = `<div class="rp-readout num">min ${fm(Math.min(...vv))} · avg ${fm(vv.reduce((a, x) => a + x, 0) / vv.length)} · max ${fm(Math.max(...vv))}</div>`
  return readout + `<div class="rp-series">${svg}</div>` + (o.sub ? `<p class="rp-footnote">점선 ${esc(o.sub)}</p>` : '')
}
function series(ctx, name, o, maxT) {
  return ctx.metricCard(name, { title: o.title, unit: o.unit, span: 6, alt: o.alt }, (data, m) => seriesBody(ctx, get(data, o.path), o, m, maxT))
}

/* ── 분포 · 막대 · 시간별 프레임 ── */
function distBody(h) {
  const hist = h.histogram
  if (!Array.isArray(hist) || hist.length === 0) return noneBody('프레임 없음')
  const N = hist.length, max = Math.max(...hist.map((b) => b.count)) || 1
  const pc = h.percentiles || {}
  const pcts = `<div class="rp-pcts">${['p50', 'p90', 'p95', 'p99'].map((k) => `<div class="rp-pct"><span class="rp-pct-k">${k}</span><b class="num">${pc[k] == null ? NONE_NULL : nf(pc[k])}<span class="rp-pct-u">ms</span></b></div>`).join('')}</div>`
  const bars = hist.map((b, i) => b.count ? `<rect class="rp-bar" x="${i + 0.12}" width="0.76" y="${(100 - (b.count / max) * 100).toFixed(2)}" height="${((b.count / max) * 100).toFixed(2)}"></rect>` : '').join('')
  const plines = ['p50', 'p90', 'p95', 'p99'].map((k) => { const v = pc[k]; const i = hist.findIndex((b) => v >= b.from_ms && (b.to_ms === null || v < b.to_ms)); return i < 0 ? '' : `<line class="rp-pline" x1="${i + 0.5}" x2="${i + 0.5}" y1="0" y2="100" vector-effect="non-scaling-stroke"></line>` }).join('')
  const grid = [0, 50, 100].map((y) => `<line class="rp-gridline" x1="0" x2="${N}" y1="${y}" y2="${y}" vector-effect="non-scaling-stroke"></line>`).join('')
  const yl = [[0, max], [50, Math.round(max / 2)], [100, 0]].map(([top, v]) => `<span class="rp-tick rp-dist-y num" style="top:${top}%">${nf(v)}</span>`).join('')
  const xl = hist.map((b, i) => i % 12 === 0 ? `<span class="rp-tick rp-dist-x num" style="left:calc(46px + (100% - 46px) * ${((i + 0.5) / N).toFixed(4)})">${b.from_ms}ms</span>` : '').join('')
  return pcts + `<div class="rp-dist"><div style="position:relative">${yl}<svg viewBox="0 0 ${N} 100" preserveAspectRatio="none" role="img" aria-label="프레임 시간 버킷 분포">${grid}${bars}${plines}</svg></div>${xl}</div>`
    + `<p class="rp-footnote">${nf(h.total_frames)} 프레임 · 버킷 ${N}칸</p>`
}
function barsBody(arr, label, value, fmt, scale) {
  if (arr === MISSING) return { html: noneBody(NONE_MISS), none: true }
  if (arr === null) return { html: noneBody(NONE_NULL), none: true }
  if (!arr.length) return noneBody('항목 없음')
  const max = scale ?? Math.max(...arr.map(value))
  return `<div class="rp-bars">${arr.map((r) => `<div class="rp-bar-row"><span class="rp-bar-label">${esc(label(r))}</span><span class="rp-bar-track"><i style="width:${Math.max(0, Math.min(100, (value(r) / max) * 100)).toFixed(1)}%"></i></span><span class="rp-bar-value num">${fmt(value(r))}</span></div>`).join('')}</div>`
}
function ftlBody(data) {
  const s = data.samples
  if (!Array.isArray(s) || s.length === 0) return noneBody('프레임 없음')
  const tMax = Math.ceil(Math.max(...s.map((r) => r[0])) / 500) * 500
  const vMax = 60, LH = 64, L = 46, W = Math.max(900, Math.round(tMax / 4.6)), top1 = 6, top2 = top1 + LH + 10, AX = top2 + LH
  const px = (t) => L + (t / tMax) * (W - L - 10)
  const hh = (v) => Math.min(LH, (v / vMax) * LH)
  const lane = (y0, idx, cls) => s.map((r) => `<rect class="${cls}" x="${px(r[0]).toFixed(1)}" width="2" y="${(y0 + LH - hh(r[idx])).toFixed(1)}" height="${hh(r[idx]).toFixed(1)}"></rect>`).join('')
  const g16 = (y0) => `<line class="rp-guide" x1="${L}" x2="${W - 10}" y1="${(y0 + LH - hh(16)).toFixed(1)}" y2="${(y0 + LH - hh(16)).toFixed(1)}"></line><text class="rp-tick-dim" x="${L - 6}" y="${(y0 + LH - hh(16) + 4).toFixed(1)}" text-anchor="end">16ms</text>`
  const xs = []; for (let t = 0; t <= tMax; t += 500) xs.push(t)
  const svg = `<svg width="${W}" height="${AX + 24}" viewBox="0 0 ${W} ${AX + 24}" role="img" aria-label="시간별 프레임">`
    + `<text class="rp-tick" x="4" y="${top1 + 14}">표시</text><text class="rp-tick" x="4" y="${top2 + 14}">앱</text>`
    + `<line class="rp-axis" x1="${L}" x2="${W - 10}" y1="${top1 + LH}" y2="${top1 + LH}"></line><line class="rp-axis" x1="${L}" x2="${W - 10}" y1="${AX}" y2="${AX}"></line>`
    + lane(top1, 2, 'rp-ftl-present') + lane(top2, 1, 'rp-ftl-app') + g16(top1) + g16(top2)
    + xs.map((t) => `<line class="rp-axis" x1="${px(t).toFixed(1)}" x2="${px(t).toFixed(1)}" y1="${AX}" y2="${AX + 3}"></line><text class="rp-tick" x="${px(t).toFixed(1)}" y="${AX + 17}" text-anchor="${t === 0 ? 'start' : 'middle'}">${nf(t / 1000, 1)}s</text>`).join('')
    + `</svg>`
  return `<div class="rp-ftl-legend"><span><i style="background:var(--color-accent-500)"></i>앱</span><span><i style="background:var(--color-accent-300)"></i>표시</span></div><div class="rp-ftl-scroll">${svg}</div>`
    + `<p class="rp-footnote">막대 = 프레임 · 아래 칸 앱 · 위 칸 표시 · 가로 = 트레이스 시작 뒤 시각</p>`
}

/* ── dexstates ── */
const abi = (x) => `${esc(x.abi)}${x.primary_abi ? ' · primary-abi' : ''}`
function compileCard(ctx, st) {
  const d = ctx.d, ta = d.target_app || {}
  const start = get(d, 'target_app.compile_state_start')
  const opts = { title: '컴파일 상태 (전 → 후)', span: 12 }
  if (start === MISSING) return ctx.card({ ...opts, body: noneBody(`${NONE_MISS} — target_app.compile_state_start 없음`), none: true })
  const c = get(d, 'session.compile')
  const top = c !== MISSING && c
    ? pairsTable([[lbl('바꾼 값', 'value'), esc(c.value), { mono: 1 }], [lbl('보낸 명령', 'command'), wbr(c.command), { mono: 1, wrap: 1 }], [lbl('걸린 시간', 'elapsed_ms'), `${nf(c.elapsed_ms)} ms`]])
    : pairsTable([[lbl('바꾼 기록', 'session.compile'), '바꾸지 않음']])
  const end = get(d, 'target_app.compile_state_end')
  const times = []
  if (c !== MISSING && c && c.before) times.push(['바꾸기 전', c.before])
  times.push(['시작', start])
  times.push(['끝', end === MISSING ? null : end])
  const dexes = (start && start.dex) || []
  const body = dexes.map((dx, i) => {
    const head = `<tr class="rp-dex-head"><td colspan="3">${wbr(dx.path)}<span class="rp-dex-abi">${abi(dx)}</span></td></tr>`
    const rows = times.map(([w, s]) => {
      const x = s && s.dex ? s.dex[i] : null
      if (!x) return `<tr class="rp-dex-row"><th>${w}</th><td colspan="2">${NONE_NULL}${noneCode(ta.compile_state_end_reason_code)}</td></tr>`
      return `<tr class="rp-dex-row"><th>${w}</th><td class="mono rp-dex-v">${esc(x.status)}</td><td class="mono rp-dex-v">${esc(x.reason)}</td></tr>`
        + `<tr class="rp-dex-loc"><td colspan="3">${lbl('파일 위치', 'location')}${wbr(x.location)}</td></tr>`
    }).join('')
    return head + rows
  }).join('')
  const table = `<div class="rp-dex-scroll"><table class="rp-table rp-dex"><thead><tr><th>때</th><th>${lbl('컴파일 필터', 'status')}</th><th>${lbl('컴파일 이유', 'reason')}</th></tr></thead><tbody>${body}</tbody></table></div>`
  return ctx.card({ ...opts, body: top + table })
}
function compileSliceCard(ctx) {
  const g = ctx.d.diagnose
  const v = g.target_process_compile_states
  const opts = { title: '컴파일 상태 slice', span: 12, m: g }
  if (v === undefined) return ctx.card({ ...opts, body: noneBody(`${NONE_MISS} — diagnose.target_process_compile_states 없음`), none: true })
  if (v === null) return ctx.card({ ...opts, body: noneBody(NONE_NULL, g.target_process_compile_states_reason_code), none: true })
  const body = v.map((x) => `<tr class="rp-dex-head"><td colspan="3">${wbr(x.location)}</td></tr><tr class="rp-dex-row"><td class="mono rp-dex-v">${esc(x.status)}</td><td class="mono rp-dex-v">${esc(x.filter)}</td><td class="mono rp-dex-v">${esc(x.reason)}</td></tr>`).join('')
  return ctx.card({ ...opts, body: `<div class="rp-dex-scroll"><table class="rp-table rp-dex"><thead><tr><th>${lbl('oat 파일 상태', 'status')}</th><th>${lbl('컴파일 필터', 'filter')}</th><th>${lbl('컴파일 이유', 'reason')}</th></tr></thead><tbody>${body}</tbody></table></div>` })
}

/* ── 탭: 요약 ── */
const TILES = [
  ['startup', '앱 시작', 'metrics.startup.data.total_time_ms', (v) => nf(v), 'ms'],
  ['hwui', '프레임 수', 'metrics.hwui.data.total_frames', (v) => nf(v), '장'],
  ['frame', '시간별 프레임', 'metrics.frame.status', (v) => esc(v), ''],
  ['cpu', '앱 CPU 시간', 'metrics.cpu.data.app.total_ms', (v) => nf(v), 'ms'],
  ['memory', '앱 RSS 최대', 'metrics.memory.data.rss.max_kb', (v) => nf(v / 1024), 'MB'],
  ['log', '앱 로그 줄', 'metrics.log.data.app.total', (v) => nf(v), '줄'],
  ['thermal', '스로틀 종료', 'metrics.thermal.data.device_status_after', thr, ''],
  ['network', '수신', 'metrics.network.data.rx_bytes', bytes, ''],
]
function tiles(ctx) {
  return `<div class="rp-tiles">${TILES.map(([name, word, path, f, unit]) => {
    const m = ctx.metric(name)
    const badge = m !== MISSING && m && BADGE[m.status]
    const why = m !== MISSING && m && m.reason ? ` title="${esc(m.reason)}"` : ''
    const v = get(ctx.d, path)
    let val
    if (badge) val = `<div class="rp-tile-none">${esc(m.reason_code || NONE_NULL)}</div>`
    else if (v === MISSING) val = `<div class="rp-tile-none">${NONE_MISS}</div>`
    else if (v === null) val = `<div class="rp-tile-none">${NONE_NULL}</div>${m && m.reason_code ? `<div class="rp-tile-code">${esc(m.reason_code)}</div>` : ''}`
    else val = `<div class="rp-tile-value num">${f(v)}${unit ? `<span class="rp-tile-unit">${unit}</span>` : ''}</div>`
    return `<div class="rp-tile"><div class="rp-tile-top"><span class="rp-tile-word">${word}</span>${badge ? `<span class="rp-badge"${why}>${badge}</span>` : ''}</div>${val}<div class="rp-tile-path">${wbr(path)}</div></div>`
  }).join('')}</div>`
}
function gaugeLevel(ms) { return ms < 500 ? 0 : ms < 2000 ? 1 : ms < 3000 ? 2 : ms < 4000 ? 3 : ms < 5000 ? 4 : 5 }

function summaryTab(ctx, st) {
  const d = ctx.d
  let maxT = 1
  for (const p of ['metrics.cpu.data.app.timeline', 'metrics.cpu.data.device_timeline', 'metrics.memory.data.timeline', 'metrics.memory.data.system_timeline', 'metrics.log.data.app.timeline']) {
    const a = get(d, p); if (Array.isArray(a)) for (const r of a) if (r.t_s > maxT) maxT = r.t_s
  }
  let h = `<section class="rp-section">${secHead('지표')}${tiles(ctx)}</section>`
  // 앱 시작
  h += section('앱 시작',
    (() => {
      const m = ctx.metric('startup')
      if (m === MISSING || BADGE[m.status] || !m.data) return ctx.metricCard('startup', { title: '앱 시작', span: 3 }, () => '')
      const s = m.data
      return `<section class="rp-card" style="grid-column: span 3;"><div class="rp-stat-title">앱 시작</div><div class="rp-gauge"><div class="rp-gauge-track"><div class="rp-gauge-fill rp-gauge-l${gaugeLevel(s.total_time_ms)}" style="width: ${Math.min(100, (s.total_time_ms / 5000) * 100).toFixed(1)}%;"></div></div><div class="rp-gauge-axis num"><span>0</span><span title="Android Vitals — app startup time (콜드 5초)">기준 5,000ms</span></div></div><div class="rp-stat-sub num">상태 ${esc(s.launch_state)} · wait ${nf(s.wait_time_ms)} ms</div></section>`
    })()
    + ctx.metricCard('startup', { title: '측정값', unit: 'am start -W', span: 5 }, (s) => pairsTable([
      ['TotalTime', cell(s.total_time_ms, 'ms')], ['WaitTime', cell(s.wait_time_ms, 'ms')], ['LaunchState', cell(s.launch_state)], ['Status', cell(s.status)]]))
    + ctx.card({ title: '진입점', span: 4, body: pairsTable([
      ['런처 액티비티', cell(get(d, 'target_app.launcher_activity'), 'wrap'), { wrap: 1 }], [lbl('프로세스 ID', 'pid'), cell(get(d, 'target_app.pid'))]]) }))
  // 렌더
  h += section('렌더',
    ctx.metricCard('hwui', { title: '프레임 시간 분포', unit: 'ms · dumpsys gfxinfo', span: 12, alt: true }, distBody)
    + ctx.metricCard('hwui', { title: '프레임 수', unit: 'dumpsys gfxinfo', span: 6 }, (x) => {
      const share = (v) => typeof v === 'number' && x.total_frames ? `${nf((v / x.total_frames) * 100, 2)}%` : ''
      return pairsTable([['Total frames rendered', cell(x.total_frames, 'int')], ['Janky frames', cell(x.janky_frames, 'int'), { share: share(x.janky_frames) }],
        ['Frame deadline missed', cell(x.deadline_missed, 'int'), { share: share(x.deadline_missed) }]]) })
    + ctx.metricCard('hwui', { title: '원인별 횟수', unit: 'dumpsys gfxinfo', span: 6 }, (x) => pairsTable([
      ['Slow UI thread', cell(x.slow_ui_thread, 'int')], ['Slow issue draw commands', cell(x.slow_draw_commands, 'int')], ['Slow bitmap uploads', cell(x.slow_bitmap_uploads, 'int')],
      ['Missed Vsync', cell(x.missed_vsync, 'int')], ['High input latency', cell(x.high_input_latency, 'int')]]))
    + ctx.metricCard('frame', { title: '시간별 프레임', unit: 'perfetto frame timeline · ms', span: 12 }, ftlBody))
  // CPU
  h += section('CPU',
    series(ctx, 'cpu', { title: '앱 CPU', unit: '% · 1코어 = 100%', path: 'app.timeline', field: 'app_cpu_ms', tf: (v) => v / 10, fmt: (v) => nf(v, 1) }, maxT)
    + series(ctx, 'cpu', { title: '기기 CPU', unit: '% · 전 코어 = 100%', path: 'device_timeline', field: 'busy_pct', alt: true, fmt: (v) => nf(v, 1) }, maxT)
    + ctx.metricCard('cpu', { title: '기기 코어별 사용률', unit: '세션 전체 · %', span: 6 }, (x) => barsBody(get(x, 'device_per_core'), (r) => `CPU ${r.cpu}`, (r) => r.busy_pct, (v) => `${nf(v, 2)}%`, 100))
    + ctx.metricCard('cpu', { title: '앱 CPU 시간', span: 6 }, (x, m) => x.app == null ? { html: noneBody(NONE_NULL, m.reason_code), none: true } : pairsTable([
      ['user', cell(x.app.user_ms, 'ms')], ['kernel', cell(x.app.kernel_ms, 'ms')], ['합계', cell(x.app.total_ms, 'ms')],
      ['표본 구간', cell(x.app.sampled_ms, 'ms')], ['표본 수', cell(x.app.samples, 'int')], ['기기 CPU 대비', cell(x.app.share_of_device_cpu_pct, 'pct')]])))
  // 메모리
  h += section('메모리',
    series(ctx, 'memory', { title: '앱 RSS', unit: 'MB', path: 'timeline', field: 'rss_kb', tf: (v) => v / 1024 }, maxT)
    + series(ctx, 'memory', { title: '기기 가용 메모리', unit: 'MB', path: 'system_timeline', field: 'mem_available_kb', tf: (v) => v / 1024, baseline: 'data', alt: true }, maxT)
    + ctx.metricCard('memory', { title: '앱 RSS 구성', unit: 'min / avg / max', span: 6 }, (x) => pairsTable([
      [lbl('RSS 최대', 'rss.max_kb'), x.rss ? mb(x.rss.max_kb) : NONE_NULL], ['anon', cell(x.rss_anon, 'mbTriple')], ['file', cell(x.rss_file, 'mbTriple')],
      ['watermark peak', cell(x.rss_watermark_peak_kb, 'mb')], ['표본 수', cell(x.samples, 'int')]]))
    + ctx.metricCard('memory', { title: '기기 메모리', unit: 'min / avg / max', span: 6, alt: true }, (x) => { const s = x.system || {}; return pairsTable([
      ['전체', cell(s.mem_total_kb, 'gb')], ['가용', cell(s.mem_available, 'mbTriple')], ['free', cell(s.mem_free, 'mbTriple')],
      ['cached', cell(s.cached, 'mbTriple')], ['swap 전체', cell(s.swap_total_kb, 'gb')], ['swap free', cell(s.swap_free, 'mbTriple')]]) }))
  // 로그
  h += section('로그',
    series(ctx, 'log', { title: '앱 로그', unit: '줄 / 초', path: 'app.timeline', field: 'count', sub: 'error' }, maxT)
    + ctx.metricCard('log', { title: 'logcat 줄 수', unit: 'metrics.log.data', span: 6 }, (x) => pairsTable([
      [lbl('최소 우선순위', 'min_prio'), cell(get(x, 'min_prio')), { mono: 1 }], [lbl('앱 전체', 'app.total'), cell(get(x, 'app.total'), 'int')],
      [lbl('앱 warn', 'app.by_priority.warn'), cell(get(x, 'app.by_priority.warn'), 'int')], [lbl('앱 error', 'app.by_priority.error'), cell(get(x, 'app.by_priority.error'), 'int')],
      [lbl('앱 fatal', 'app.by_priority.fatal'), cell(get(x, 'app.by_priority.fatal'), 'int')], [lbl('기기 전체', 'device_total'), cell(get(x, 'device_total'), 'int')],
      [lbl('기기 warn', 'device_by_priority.warn'), cell(get(x, 'device_by_priority.warn'), 'int')], [lbl('기기 error', 'device_by_priority.error'), cell(get(x, 'device_by_priority.error'), 'int')]]))
    + ['device_crashes', 'device_anrs'].map((k, i) => ctx.metricCard('log', { title: i ? 'ANR' : '크래시', unit: 'logcat · 기기 전역', span: 2 }, (x) => {
      const a = get(x, k)
      if (a === MISSING) return { html: noneBody(NONE_MISS), none: true }
      if (a === null) return { html: noneBody(NONE_NULL), none: true }
      if (!a.length) return noneBody(i ? 'ANR 없음' : '크래시 없음')
      return `<table class="rp-table"><tbody>${a.map((c) => `<tr><td class="mono rp-wrap" style="text-align:left">${wbr(typeof c === 'string' ? c : (c.process || c.package || JSON.stringify(c)))}</td></tr>`).join('')}</tbody></table>`
    })).join(''))
  // 맥락
  const sb = d.device.state_before || {}, sa = d.device.state_after || {}
  const dv = (a, b, f) => a === b ? '-' : f(b - a)
  const deltaRow = (l, a, b, f, df) => `<tr><th>${l}</th><td class="num rp-before">${a}</td><td class="rp-arrow">→</td><td class="num">${b}</td><td class="num rp-delta-v">${df}</td></tr>`
  const warns = Array.isArray(d.warnings) ? d.warnings : []
  const mo = d.measurement_overhead || {}
  h += section('맥락',
    ctx.metricCard('thermal', { title: '온도 (세션 전 → 후)', unit: '°C', span: 4 }, (x) => `<table class="rp-table rp-delta"><tbody>${(x.zones || []).map((z) =>
      deltaRow(esc(z.name), `${nf(z.before_c, 1)}°C`, `${nf(z.after_c, 1)}°C`, 0, z.delta_c ? `${z.delta_c > 0 ? '+' : ''}${nf(z.delta_c, 1)}°C` : '-')).join('')}</tbody></table>`)
    + ctx.metricCard('thermal', { title: '스로틀 단계', unit: 'dumpsys thermalservice', span: 4 }, (x) => pairsTable([['시작', cell(x.device_status_before, 'thr')], ['종료', cell(x.device_status_after, 'thr')]]))
    + ctx.card({ title: '기기 상태 (전 → 후)', span: 4, body: `<table class="rp-table rp-delta"><tbody>`
      + deltaRow('배터리', `${sb.battery_level}%`, `${sa.battery_level}%`, 0, dv(sb.battery_level, sa.battery_level, (x) => `${x > 0 ? '+' : ''}${x}%`))
      + deltaRow('배터리 온도', `${nf(sb.battery_temp_c, 1)}°C`, `${nf(sa.battery_temp_c, 1)}°C`, 0, dv(sb.battery_temp_c, sa.battery_temp_c, (x) => `${x > 0 ? '+' : ''}${nf(x, 1)}°C`))
      + deltaRow('충전', yn(sb.charging), yn(sa.charging), 0, '-')
      + deltaRow('가용 메모리', mb(sb.mem_available_kb), mb(sa.mem_available_kb), 0, dv(Math.round(sb.mem_available_kb / 1024), Math.round(sa.mem_available_kb / 1024), (x) => `${x > 0 ? '+' : ''}${nf(x)} MB`))
      + deltaRow('밝기', esc(sb.screen_brightness), esc(sa.screen_brightness), 0, dv(sb.screen_brightness, sa.screen_brightness, (x) => `${x > 0 ? '+' : ''}${x}`))
      + deltaRow('절전', yn(sb.power_save_mode), yn(sa.power_save_mode), 0, '-')
      + deltaRow('네트워크', esc(sb.network), esc(sa.network), 0, '-')
      + deltaRow('애니메이션 배율', esc(sb.animator_duration_scale), esc(sa.animator_duration_scale), 0, '-') + `</tbody></table>` })
    + ctx.metricCard('network', { title: '네트워크', unit: 'uid 델타 · 세션 총량', span: 4 }, (x) => pairsTable([
      ['수신', cell(x.rx_bytes, 'bytes')], ['송신', cell(x.tx_bytes, 'bytes')], ['수신 패킷', cell(x.rx_packets, 'int')], ['송신 패킷', cell(x.tx_packets, 'int')],
      [lbl('사용자 ID', 'uid'), cell(x.uid)], ['uid 공유', cell(x.shared_uid_packages, 'list'), { wrap: 1 }]]))
    + ctx.card({ title: '경고', unit: '측정 조건 관측 · 평가 아님', span: 4, body: warns.length === 0 ? noneBody('경고 없음')
      : `<table class="rp-table rp-warn"><tbody>${warns.map((w) => `<tr><th class="mono">${wbr(w.code)}</th><td>${wbr(w.message)}</td></tr>`).join('')}</tbody></table>` })
    + ctx.card({ title: '측정 비용', span: 4, body: pairsTable([
      ['수집 CPU 시간', cell(mo.tracing_processes_cpu_time_ms, 'ms')], ['수집 CPU 몫', cell(mo.tracing_processes_cpu_share_pct, 'pct')],
      ['수집 RSS 최대', mo.tracing_processes_peak_rss_kb == null ? NONE_NULL : `${nf(mo.tracing_processes_peak_rss_kb / 1024, 1)} MB`],
      ['세션 중 adb 명령', cell(mo.adb_commands_during_session, 'int')], ['버퍼 넘침', cell(mo.trace_buffer_overrun, 'bool')]]) })
    + compileCard(ctx, st))
  return h
}

/* ── 탭: 기기 ── */
function deviceTab(ctx) {
  const d = ctx.d, s = d.device.static || {}, a = d.target_app || {}, dp = s.display || {}
  const g = (o, k) => (k in o ? o[k] : MISSING)
  return section('기기 · 앱',
    ctx.card({ title: '기기', span: 4, body: pairsTable([
      ['제조사', cell(g(s, 'manufacturer'))], ['모델', cell(g(s, 'model'))], ['Android', cell(g(s, 'android_release'))],
      [lbl('SDK 버전', 'sdk_int'), cell(g(s, 'sdk_int'))], ['SoC', cell(g(s, 'soc_model'))], ['SoC 제조사', cell(g(s, 'soc_manufacturer'))],
      ['메모리', cell(g(s, 'memory_total_kb'), 'gb')], ['ABI', cell(g(s, 'abis'), 'list'), { wrap: 1 }],
      [lbl('빌드 지문', 'fingerprint'), cell(g(s, 'build_fingerprint'), 'wrap'), { wrap: 1, mono: 1 }]]) })
    + ctx.card({ title: '앱', span: 4, body: pairsTable([
      ['이름', cell(g(a, 'label'))], ['패키지', cell(g(a, 'package'), 'wrap'), { wrap: 1 }], ['버전', cell(g(a, 'version_name'))],
      [lbl('버전 코드', 'versionCode'), cell(g(a, 'version_code'), 'int')], [lbl('디버그 빌드', 'debuggable'), cell(g(a, 'debuggable'), 'bool')],
      [lbl('큰 힙', 'largeHeap'), cell(g(a, 'large_heap'), 'bool')], [lbl('최소 SDK', 'minSdk'), cell(g(a, 'min_sdk'))], [lbl('대상 SDK', 'targetSdk'), cell(g(a, 'target_sdk'))],
      ['ABI', cell(g(a, 'primary_cpu_abi'))], [lbl('사용자 ID', 'uid'), cell(g(a, 'uid'))], [lbl('프로세스 ID', 'pid'), cell(g(a, 'pid'))],
      ['설치 경로', cell(g(a, 'install_source'), 'wrap'), { wrap: 1 }], ['진입점', cell(g(a, 'launcher_activity'), 'wrap'), { wrap: 1 }]]) })
    + ctx.card({ title: '화면', span: 4, body: pairsTable([
      ['가로', cell(g(dp, 'width_px'), 'int')], ['세로', cell(g(dp, 'height_px'), 'int')], ['dpi', cell(g(dp, 'density_dpi'), 'int')],
      ['주사율', cell(g(dp, 'active_refresh_rate_hz'), 'hz')], ['지원 주사율', cell(g(dp, 'supported_refresh_rates_hz'), 'list'), { wrap: 1 }],
      ['방향', cell(g(dp, 'orientation'))], ['크기 구간', cell(g(dp, 'size_class'))], ['OpenGL ES', cell(g(dp, 'opengl_es_version'))]]) })
    + ctx.card({ title: 'CPU 클러스터 최대 주파수', unit: 'GHz', span: 6, body: barsBody(s.cpu ? s.cpu.clusters : MISSING,
      (r) => `CPU ${r.cpus[0]}–${r.cpus[r.cpus.length - 1]}`, (r) => r.max_freq_khz, (v) => `${nf(v / 1e6, 2)} GHz`, null) }))
}

/* ── 탭: 진단 ── */
const GROUPS = [['main_thread', '메인 스레드'], ['other_threads', '그 밖 스레드'], ['async_tracks', '비동기 트랙']]
const SUBS = [['count', '횟수'], ['sum_ms', '합 ms'], ['max_ms', '최대 ms']]
function diagTab(ctx, sort) {
  const d = ctx.d, g = d.diagnose
  const code = g.reason_code
  const v = (k, f, c) => cell(k in g ? g[k] : MISSING, f, c)
  const rows = g.target_process_slice_names
  let sliceBody, unit = '', none = false
  if (rows === null || rows === undefined) { sliceBody = noneBody(rows === null ? NONE_NULL : NONE_MISS, code); none = true }
  else {
    unit = `대상 앱 프로세스 · ${nf(rows.length)}행`
    const val = (r, k) => { if (k === 'name') return r.name; const [gg, s] = k.split('.'); return r[gg] ? r[gg][s] : null }
    const cmp = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0
    const sorted = rows.slice().sort((a, b) => {
      if (sort.key === 'name') return sort.dir === 'asc' ? cmp(a, b) : -cmp(a, b)
      const x = val(a, sort.key), y = val(b, sort.key)
      if (x == null && y == null) return cmp(a, b); if (x == null) return 1; if (y == null) return -1
      return x !== y ? (sort.dir === 'asc' ? x - y : y - x) : cmp(a, b)
    })
    const arrow = (k) => sort.key === k ? (sort.dir === 'asc' ? ' ▲' : ' ▼') : ''
    const aria = (k) => sort.key === k ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'
    const sth = (k, l, extra = '') => `<th scope="col" aria-sort="${aria(k)}"${extra}><button type="button" class="rp-slice-sort" data-k="${k}">${l}<span aria-hidden="true">${arrow(k)}</span></button></th>`
    const body = sorted.map((r) => `<tr><th scope="row" class="rp-slice-name">${wbr(r.name)}</th>${GROUPS.map(([gk]) => SUBS.map(([sk], i) => {
      const o = r[gk], cls = i === 0 ? ' rp-slice-gs' : ''
      return o ? `<td class="num${cls}">${sk === 'count' ? nf(o[sk]) : nf(o[sk], 1)}</td>` : `<td class="num rp-slice-nil${cls}">—</td>`
    }).join('')).join('')}</tr>`).join('')
    sliceBody = `<div class="rp-slice-scroll"><table class="rp-table rp-slice"><thead><tr>${sth('name', '이름', ' rowspan="2" class="rp-slice-name-h"')}${GROUPS.map(([, l]) => `<th scope="colgroup" colspan="3" class="rp-slice-group">${l}</th>`).join('')}</tr><tr>${GROUPS.map(([gk]) => SUBS.map(([sk, l], i) => sth(`${gk}.${sk}`, l, i === 0 ? ' class="rp-slice-gs"' : '')).join('')).join('')}</tr></thead><tbody>${body}</tbody></table></div>`
  }
  const card = (title, rows) => ctx.card({ title, span: 4, m: g, body: pairsTable(rows) })
  return section('atrace slice',
    card('기록 범위', [[lbl('켠 카테고리', 'atrace_categories'), v('atrace_categories', 'dots')], [lbl('대상 앱', 'atrace_apps'), v('atrace_apps', 'list'), { wrap: 1 }],
      [lbl('앱 slice 열림', 'app_slices_open'), cell(g.app_slices_open, 'bool', g.app_slices_open_reason_code), { title: g.app_slices_open_reason || '' }]])
    + card('slice 수', [[lbl('트레이스 전체', 'trace_slices'), v('trace_slices', 'int')], [lbl('대상 앱', 'target_process_slices'), v('target_process_slices', 'int')],
      [lbl('끝나지 않음', 'target_process_slices_unfinished'), v('target_process_slices_unfinished', 'int')],
      [lbl('접기 전 이름 수', 'target_process_slice_names_unfolded'), v('target_process_slice_names_unfolded', 'int')],
      [lbl('ftrace 넘침', 'ftrace_overrun_events'), v('ftrace_overrun_events', 'int')],
      [lbl('JIT 컴파일 slice', 'target_process_jit_slices'), v('target_process_jit_slices', 'int', g.target_process_jit_slices_reason_code)]])
    + card('원본', [[lbl('원본 파일', 'artifacts.trace'), cell(get(d, 'artifacts.trace'), 'wrap'), { mono: 1, wrap: 1 }], [lbl('원본 크기', 'diagnose.trace_bytes'), v('trace_bytes', 'bytes')]])
    + compileSliceCard(ctx)
    + ctx.card({ title: 'slice 이름별', unit, span: 12, m: g, body: sliceBody, none }))
}

/* ── 문서 ── */
function renderDoc(d, st, tab, sort) {
  const tabs = [['summary', '요약', summaryTab], ['device', '기기', deviceTab]]
  if (d.diagnose) tabs.push(['diagnose', '진단', diagTab])
  if (!tabs.some((t) => t[0] === tab)) tab = 'summary'
  let content = ''
  const counts = {}
  for (const [id, , fn] of tabs) {
    const ctx = new Ctx(d)
    const html = fn(ctx, id === 'diagnose' ? sort : st)
    counts[id] = ctx.none
    if (id === tab) content = html
  }
  const rail = `<nav class="rp-rail"><div class="rp-brand"><div class="rp-brand-1">PERFTRACKER</div><div class="rp-brand-2">세션 데이터</div></div>${tabs.map(([id, l]) =>
    `<button class="rp-tab${id === tab ? ' rp-tab-on' : ''}" aria-current="${id === tab}" data-tab="${id}"><span>${l}</span>${counts[id] ? `<span class="rp-tab-count mono">${counts[id]}</span>` : ''}</button>`).join('')}</nav>`
  const a = d.target_app || {}, s = d.device.static || {}, ss = d.session
  const opts = ['--launch']; if (ss.options && ss.options.compile) opts.push(`--compile ${ss.options.compile}`)
  const meta = [['앱', `${esc(a.label)} · ${wbr(a.package)} · ${esc(a.version_name)}`], ['기기', `${esc(s.model)} · ${esc(d.device.serial)} · Android ${esc(s.android_release)} (sdk ${esc(s.sdk_int)})`],
    ['시작', esc(String(ss.started_at).slice(0, 19).replace('T', ' '))], ['길이', `${nf(ss.duration_ms)} ms`], ['옵션', esc(opts.join(' '))]]
  const head = `<header class="rp-head"><div class="rp-head-top"><span class="rp-sid mono">${esc(ss.id)}</span><h1 class="rp-name">${esc(ss.name)}</h1><span class="rp-state">${esc(ss.state)}</span>${d.diagnose ? '<span class="rp-state rp-state-diagnose">진단</span>' : ''}</div><div class="rp-meta">${meta.map(([k, v]) => `<span class="rp-meta-item"><i>${k}</i>${v}</span>`).join('')}</div></header>`
  const t = d.tool || {}, hh = t.host || {}
  const footer = `<footer class="rp-footer"><span class="mono">${esc(t.name)} ${esc(t.version)} · ${esc(hh.os)}/${esc(hh.arch)} · node ${esc(hh.node)}</span><span class="mono">schema_version ${esc(d.schema_version)}</span></footer>`
  return `<div class="rp-shell">${rail}<main class="rp-main">${head}${content}${footer}</main></div>`
}

class Component extends DCLogic {
  shot = new URLSearchParams(location.search).has('shot')
  state = { st: 'summary', tab: null, base: null, ready: false, sort: { key: 'name', dir: 'asc' } }
  componentDidMount() {
    const q = new URLSearchParams(location.search)
    const us = q.get('state')
    this.urlState = STATES.includes(us) ? us : null
    const st = this.urlState ?? (STATES.includes(this.props.state) ? this.props.state : 'summary')
    this.setState({ st })
    window.addEventListener('resize', this.onResize)
    fetch('report-readability/base.json').then((r) => r.json()).then((base) => {
      const wait = () => window.RR_STATES ? this.setState({ base, ready: true }) : setTimeout(wait, 30)
      wait()
    })
  }
  componentDidUpdate(prev) {
    if (prev.state !== this.props.state && STATES.includes(this.props.state)) this.pick(this.props.state)
    this.paint()
  }
  pick(st) {
    this.setState({ st, tab: null, sort: { key: 'name', dir: 'asc' } })
    try { const u = new URL(location.href); u.searchParams.set('state', st); history.replaceState(null, '', u) } catch (e) {}
  }
  rootRef = (el) => { this.root = el; this.paint() }
  onResize = () => { clearTimeout(this.rt); this.rt = setTimeout(() => this.paint(), 120) }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize) }
  paint() {
    const s = this.state
    if (!this.root || !s.ready) return
    const entry = window.RR_STATES[s.st]
    if (this.docKey !== s.st) { this.doc = entry[0](s.base); this.docKey = s.st }
    const tab = s.tab ?? entry[1]
    const key = `${s.st}|${tab}|${s.sort.key}|${s.sort.dir}`
    const vw = window.innerWidth
    const avail = Math.min(1400, vw - (vw > 820 ? 212 : 0)) - (vw > 820 ? 40.8 : 27.2)
    const inner = (vw > 1180 ? (avail - 6.8) / 2 : avail) - 22.4
    const sw = Math.max(240, Math.round(inner * 12 / 13))
    if (sw !== SERIES.w) { SERIES.w = sw; this.painted = null }
    if (key === this.painted) return
    const prevTab = this.paintedTab
    this.root.innerHTML = renderDoc(this.doc, s.st, tab, s.sort)
    this.painted = key; this.paintedTab = `${s.st}|${tab}`
    if (prevTab !== this.paintedTab) window.scrollTo(0, 0)
  }
  onRootClick = (e) => {
    const t = e.target.closest('[data-tab]')
    if (t) { this.setState({ tab: t.dataset.tab }); return }
    const k = e.target.closest('.rp-slice-sort')
    if (k) {
      const key = k.dataset.k, so = this.state.sort
      this.setState({ sort: so.key === key ? { key, dir: so.dir === 'asc' ? 'desc' : 'asc' } : { key, dir: key === 'name' ? 'asc' : 'desc' } })
    }
  }
  renderVals() {
    return {
      rootRef: this.rootRef,
      onRootClick: this.onRootClick,
      showPicker: this.shot !== true,
      picks: STATES.map((id) => ({ id, on: String(id === this.state.st), go: () => this.pick(id) })),
    }
  }
}

</script>
</body>
