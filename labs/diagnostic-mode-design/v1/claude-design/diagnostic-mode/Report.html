+['렌더','CPU','메모리','로그'].map(t=>`<section class="rp-section">${secHead(t)}<div class="diag-ph" aria-hidden="true"></div></section>`).join('')
+`<section class="rp-section">${secHead('맥락')}<div class="rp-grid"><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">온도 (세션 전 → 후)</h3><span class="rp-card-unit">°C</span></header><table class="rp-table rp-delta"><tbody><tr><th>skin</th><td class="num rp-before">32.4°C</td><td class="rp-arrow">→</td><td class="num">33.1°C</td><td class="num rp-delta-v">+0.7°C</td></tr></tbody></table></section><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">스로틀 단계</h3><span class="rp-card-unit">dumpsys thermalservice</span></header><table class="rp-table"><tbody><tr><th>시작</th><td class="num">NONE (0)</td><td class="rp-share num"></td></tr><tr><th>종료</th><td class="num">NONE (0)</td><td class="rp-share num"></td></tr></tbody></table></section><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">기기 상태 (전 → 후)</h3></header><table class="rp-table rp-delta"><tbody><tr><th>배터리</th><td class="num rp-before">100%</td><td class="rp-arrow">→</td><td class="num">100%</td><td class="num rp-delta-v">-</td></tr><tr><th>충전</th><td class="num rp-before">아니오</td><td class="rp-arrow">→</td><td class="num">아니오</td><td class="num rp-delta-v">-</td></tr><tr><th>가용 메모리</th><td class="num rp-before">1,552 MB</td><td class="rp-arrow">→</td><td class="num">1,506 MB</td><td class="num rp-delta-v">-47 MB</td></tr><tr><th>네트워크</th><td class="num rp-before">wifi</td><td class="rp-arrow">→</td><td class="num">wifi</td><td class="num rp-delta-v">-</td></tr></tbody></table></section><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">네트워크</h3><span class="rp-card-unit">uid 델타 · 세션 총량</span></header><table class="rp-table"><tbody><tr><th>수신</th><td class="num">0 B</td><td class="rp-share num"></td></tr><tr><th>송신</th><td class="num">0 B</td><td class="rp-share num"></td></tr><tr><th>uid</th><td class="num">1000</td><td class="rp-share num"></td></tr></tbody></table></section><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">경고</h3><span class="rp-card-unit">측정 조건 관측 · 평가 아님</span></header><div class="rp-none"><span>경고 없음</span></div></section><section class="rp-card" style="grid-column: span 4;"><header class="rp-card-head"><h3 class="rp-card-title">측정 비용</h3><span class="rp-card-unit">앱 프로세스 몫 미포함</span></header><table class="rp-table"><tbody><tr><th>수집 CPU 시간</th><td class="num">370 ms</td><td class="rp-share num"></td></tr><tr><th>수집 CPU 몫</th><td class="num">0.28%</td><td class="rp-share num"></td></tr><tr><th>수집 RSS 최대</th><td class="num">13.0 MB</td><td class="rp-share num"></td></tr><tr><th>세션 중 adb 명령</th><td class="num">0</td><td class="rp-share num"></td></tr><tr><th>버퍼 넘침</th><td class="num">아니오</td><td class="rp-share num"></td></tr></tbody></table></section></div></section>`;

const VALS={
 // 고침 1: 블록 status · reason_code 는 행이 아니라 카드 배지(unsupported · skipped · failed) · 카드 제목/배지 title(reason 문장),
 // 이유 코드는 값이 null 일 때만 값 자리에 (report HANDOFF ④ · stat 관례). 열림 이유는 열림 행 title.
 collected:{open:'예',reason:null,openWhy:null,why:null,total:'74,906',app:'62,682',unf:'41',nbf:'5,369',lost:'0',trace:PATH,bytes:'6.5 MB',slice:null,unit:'대상 앱 프로세스 · 1,055행'},
 'open-null':{open:null,reason:'app_slices_open_unknown',openWhy:'sdk 30 · debuggable 아님 · profileable 읽을 출처 없음',why:null,total:'31,207',app:'24,530',unf:'12',nbf:'2,204',lost:'0',trace:PATH,bytes:'3.1 MB',slice:null,unit:'대상 앱 프로세스 · 618행'},
 'no-process':{open:'예',reason:null,openWhy:null,why:'대상 앱(com.google.android.youtube)의 프로세스가 트레이스에 없습니다 — 세션 동안 실행되지 않았을 수 있습니다.',total:'52,118',app:null,unf:null,nbf:null,lost:'0',trace:PATH,bytes:'5.0 MB',slice:'process_not_in_trace',unit:''},
 failed:{open:'예',reason:null,openWhy:null,why:'트레이스 원본이 없습니다.',total:null,app:null,unf:null,nbf:null,lost:null,trace:null,bytes:null,slice:'trace_missing',unit:'',badge:1}
};
const v=VALS[st]||VALS.collected;
const pair=(label,val,o={})=>`<tr${o.title?` title="${o.title}"`:''}><th>${label}</th><td class="num diag-val${val!=null&&o.mono?' mono':''}${val!=null&&o.wrap?' rp-wrap':''}">${val==null?NONE+(o.code?`<code class="rp-none-code">${o.code}</code>`:''):val}</td><td class="rp-share num"></td></tr>`;
const why=v.why?` title="${v.why}"`:'';
const cardHead=(title,unit)=>`<header class="rp-card-head"><h3 class="rp-card-title"${why}>${title}</h3><span class="rp-card-unit">${unit}</span>${v.badge?`<span class="rp-badge"${why}>실패</span>`:''}</header>`;
const pairsCard=(title,unit,rows)=>`<section class="rp-card" style="grid-column: span 4;">${cardHead(title,unit)}<table class="rp-table diag-pairs"><tbody>${rows.join('')}</tbody></table></section>`;

const GROUPS=[['main','메인 스레드'],['other','그 밖 스레드'],['async','비동기 트랙']];
const SUBS=['횟수','합 ms','최대 ms'];
let sort=st==='sorted'?{key:'main.1',dir:'desc'}:{key:'name',dir:'asc'};
const valOf=(r,k)=>{if(k==='name')return r.name;const [g,i]=k.split('.');return r[g]?r[g][+i]:null;};
const nameCmp=(a,b)=>a.name<b.name?-1:a.name>b.name?1:0;
function sorted(){return ROWS.slice().sort((a,b)=>{
 if(sort.key==='name'){const c=nameCmp(a,b);return sort.dir==='asc'?c:-c;}
 const x=valOf(a,sort.key),y=valOf(b,sort.key);
 if(x==null&&y==null)return nameCmp(a,b);if(x==null)return 1;if(y==null)return -1;
 if(x!==y)return sort.dir==='asc'?x-y:y-x;return nameCmp(a,b);});}
const fmtN=(n)=>n.toLocaleString('en-US');
const fmtMs=(n)=>n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
function bodyHtml(){return sorted().map(r=>'<tr><th scope="row" class="diag-name">'+r.name.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</th>'+GROUPS.map(([g])=>[0,1,2].map(i=>{const a=r[g];const cls=i===0?' diag-gs':'';return a?`<td class="num${cls}">${i===0?fmtN(a[0]):fmtMs(a[i])}</td>`:`<td class="num diag-nil${cls}">—</td>`;}).join('')).join('')+'</tr>').join('');}
const sortTh=(k,label,extra)=>`<th scope="col" aria-sort="none" data-k="${k}"${extra||''}><button type="button" class="diag-sort" data-k="${k}"><span>${label}</span><span class="diag-arrow" aria-hidden="true"></span></button></th>`;
const tableHtml=`<div class="diag-scroll"><table class="rp-table diag-table"><thead><tr>${sortTh('name','이름',' rowspan="2" class="diag-name-h"')}${GROUPS.map(([,l])=>`<th scope="colgroup" colspan="3" class="diag-g">${l}</th>`).join('')}</tr><tr>${GROUPS.map(([g])=>SUBS.map((s,i)=>sortTh(g+'.'+i,s,i===0?' class="diag-gs"':'')).join('')).join('')}</tr></thead><tbody></tbody></table></div>`;
const sliceBody=v.slice?`<div class="rp-none"><span>${NONE}</span><code class="rp-none-code">${v.slice}</code></div>`:tableHtml;

const diag=`<section class="rp-section">${secHead('atrace slice')}<div class="rp-grid">`
+pairsCard('기록 범위','diagnose',[pair('atrace_categories','am · wm · view'),pair('atrace_apps','com.google.android.youtube'),pair('app_slices_open',v.open,{code:v.reason,title:v.openWhy})])
+pairsCard('slice 수','diagnose',[pair('slices_total',v.total),pair('slices_app',v.app),pair('slices_unfinished',v.unf),pair('names_before_fold',v.nbf),pair('ftrace_lost',v.lost)])
+pairsCard('원본','',[pair('artifacts.trace',v.trace,{mono:1,wrap:1}),pair('diagnose.trace_bytes',v.bytes)])
+`<section class="rp-card" id="slice-card" style="grid-column: span 12;">${cardHead('slice 이름별',v.unit)}${sliceBody}</section></div></section>`;

const picker=shot?'':`<div class="diag-picker" aria-label="시안 상태">${STATES.map(s=>`<button type="button" data-s="${s}" aria-current="${s===st}">${s}</button>`).join('')}</div>`;
document.getElementById('root').innerHTML=`<div class="rp-shell">${rail}<main class="rp-main">${head}${st==='summary'?summary:diag}${footer}</main></div>`+picker;

const go=(s)=>{const u=new URL(location.href);u.searchParams.set('state',s);location.href=u.toString();};
document.querySelectorAll('.diag-picker button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.s)));
document.querySelectorAll('.rp-tab[data-go]').forEach(b=>b.addEventListener('click',()=>{if(b.getAttribute('aria-current')!=='true')go(b.dataset.go);}));

const table=document.querySelector('.diag-table');
if(table){
 const tbody=table.tBodies[0];
 const paint=()=>{
  table.querySelectorAll('thead th[data-k]').forEach(th=>{const on=th.dataset.k===sort.key;th.setAttribute('aria-sort',on?(sort.dir==='asc'?'ascending':'descending'):'none');th.querySelector('.diag-arrow').textContent=on?(sort.dir==='asc'?' ▲':' ▼'):'';});
  tbody.innerHTML=bodyHtml();
 };
 const measure=()=>table.style.setProperty('--diag-h1',table.tHead.rows[0].getBoundingClientRect().height+'px');
 table.querySelectorAll('.diag-sort').forEach(b=>{
  b.addEventListener('click',()=>{const k=b.dataset.k;if(sort.key===k)sort.dir=sort.dir==='asc'?'desc':'asc';else sort={key:k,dir:k==='name'?'asc':'desc'};paint();table.closest('.diag-scroll').scrollTop=0;});
  b.addEventListener('blur',()=>b.classList.remove('diag-focus'));
 });
 paint();measure();addEventListener('resize',measure);
 if(document.fonts)document.fonts.ready.then(measure);
 if(st==='sorted'){const b=table.querySelector('.diag-sort[data-k="main.1"]');b.classList.add('diag-focus');b.focus({preventScroll:true});}
}
})();
</script>
</body></html>
